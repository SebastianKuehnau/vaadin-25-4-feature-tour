home.lead=Un recorrido práctico por la versión: seguridad, API del framework, componentes, IA y herramientas. Cada página es una demo en vivo con el código Java que hay detrás.
area.security.lead=Ejecución bajo una Content Security Policy estricta, con JavaScript declarado en Java en lugar de enviado como cadenas.
area.flow.lead=Nuevos componentes HTML, descargas desde cualquier componente, menús jerárquicos, eventos de ciclo de vida y pequeñas mejoras de la API.
area.components.lead=La vista previa del PDF Viewer, etiquetas al lado, seleccionar todo, selección de texto y más mejoras en componentes existentes.
area.ai.lead=Paginación para el AI Grid y un Message Input más inteligente.
area.tooling.lead=Novedades de Copilot y cambios internos que no necesitan una demo.
