# components (fr)
summary.AccessibilityView=Niveaux de titre, aria-describedby, capture par caméra, findTabContaining(), variantes de Slider.
summary.ButtonView=DisableOnClickMode.UNTIL_RESPONSE réactive le bouton dès que le serveur a terminé.
summary.GridView=Clic sur une ligne en sélection multiple, getColumnBySortProperty(), menus contextuels sensibles à la colonne.
summary.LabelsAsideView=LABEL_ASIDE sur les champs et alignement du texte des libellés dans Form Layout.
summary.MultiSelectView=Un bouton Tout sélectionner qui peut aussi sélectionner uniquement les éléments filtrés.
summary.NowStableView=Switch et Breadcrumbs sont prêts pour la production : plus de feature flags.
summary.PdfViewerView=Afficher des PDF dans l'application : depuis une URL ou un DownloadHandler, avec navigation, zoom et actions de barre d'outils.
summary.TextSelectionView=setSelectionRange(), selectAll() et setCursorPosition() depuis le serveur.
components.accessibility.lead=De petites améliorations dans l'ensemble des composants, dont beaucoup destinées aux utilisateurs de lecteurs d'écran.
components.accessibility.headings.dialogDescription=Vos modifications seront perdues si vous ne les enregistrez pas d'abord.
components.accessibility.headings.dialogTitle=Modifications non enregistrées
