home.lead=Un tour pratico della versione: sicurezza, API del framework, componenti, IA e strumenti. Ogni pagina è una demo dal vivo con il codice Java che la realizza.
area.security.lead=Esecuzione con una Content Security Policy rigorosa, con JavaScript dichiarato in Java invece che inviato come stringhe.
area.flow.lead=Nuovi componenti HTML, download da qualsiasi componente, menu gerarchici, eventi del ciclo di vita e piccoli miglioramenti delle API.
area.components.lead=L'anteprima del PDF Viewer, etichette a lato, seleziona tutto, selezione del testo e altri miglioramenti ai componenti esistenti.
area.ai.lead=Paginazione per l'AI Grid e un Message Input più intelligente.
area.tooling.lead=Le novità di Copilot e le modifiche interne che non richiedono una demo.
