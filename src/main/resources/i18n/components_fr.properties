components.pdf.handler.heading=Depuis un DownloadHandler, piloté depuis Java
components.pdf.handler.desc=La page et le nombre de pages sont des signals, donc le libellé suit le viewer. L'icône de favori à la fin de la barre d'outils du viewer est un Button ordinaire ajouté avec getToolbarActions().
components.textselection.lead=Sélectionnez du texte ou déplacez le curseur dans Text Field, Text Area, Password Field et Big Decimal Field depuis Java. Tous implémentent HasTextSelection.
