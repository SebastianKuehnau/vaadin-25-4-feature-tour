# security (fr)
summary.StrictCspView=vaadin.csp=off|warn|strict : repérez et supprimez le JavaScript envoyé sous forme de chaînes.
security.strictcsp.legacy.button=Legacy : executeJs(String)
security.strictcsp.declared.button=Déclaré : executeJs(TextJs.class)
security.strictcsp.target.waiting=En attente de JavaScript…
security.strictcsp.lead=Flow peut désormais fonctionner avec une Content-Security-Policy à nonce, sans 'unsafe-eval'. Définissez vaadin.csp=warn pour trouver chaque appel qui envoie du JavaScript sous forme de chaîne, corrigez-les, puis passez à strict.
security.strictcsp.note=Bêta 2 : Vaadin envoie lui-même encore du JavaScript sous forme de chaîne à quelques endroits, comme les filtres d'événements des écouteurs de double clic et de clic simple et les raccourcis clavier. Ceux-ci lèvent une exception en mode strict tant qu'ils ne sont pas modifiés ; essayez donc strict d'abord sur une copie de votre application et restez sur warn pour l'instant.
security.strictcsp.mode.production=Mode production. Redémarrez avec VAADIN_CSP=off|warn|strict pour changer.
security.strictcsp.mode.development=Mode développement. Redémarrez avec VAADIN_CSP=off|warn|strict pour changer.
security.strictcsp.table.off.all=Par défaut. Rien n'est vérifié.
security.strictcsp.table.off.prod=Pas d'en-tête.
security.strictcsp.table.warn.all=Le JavaScript sous forme de chaîne s'exécute, et chaque site d'appel est consigné une fois avec une trace de pile vers votre code.
security.strictcsp.table.warn.prod=Comme en développement. Pas d'en-tête.
security.strictcsp.table.strict.all=Le JavaScript sous forme de chaîne lève une CspViolationException, y compris en mode développement.
security.strictcsp.table.strict.prod=Envoie aussi un en-tête Content-Security-Policy à nonce.
security.strictcsp.table.mode=Mode
security.strictcsp.table.everywhere=Développement et production
security.strictcsp.table.production=Production uniquement
security.strictcsp.mode.heading=Le mode actuel
security.strictcsp.mode.desc=Le mode s'applique aussi bien au développement qu'à la production. La seule différence est l'en-tête : en mode développement, aucun en-tête n'est envoyé, car le serveur de développement et les outils de développement ont besoin d'eval.
security.strictcsp.legacy.set=Défini par une chaîne, compilée dans le navigateur
security.strictcsp.legacy.ran=Exécuté. En mode warn, le premier appel depuis cette ligne est consigné ci-dessous.
security.strictcsp.legacy.blocked=Bloqué : {0} (mode strict)
security.strictcsp.declared.set=Défini par du JavaScript déclaré depuis le bundle
security.strictcsp.declared.ran=Exécuté. Le JavaScript déclaré n'est jamais signalé : rien n'est compilé dans le navigateur.
security.strictcsp.warnings.none=Aucun avertissement capturé pour le moment.
security.strictcsp.legacy.heading=Un appel legacy à côté de son remplaçant déclaré
security.strictcsp.legacy.desc=Les deux boutons définissent le texte ci-dessous. Le premier envoie du JavaScript sous forme de chaîne, ce qu'une politique stricte bloque. Le second appelle une méthode d'interface dont le JavaScript est intégré au bundle lors du build. Les avertissements du logger du rapporteur CSP apparaissent ci-dessous au fur et à mesure qu'ils sont consignés.
summary.DeclaredJsView=@JsDefinition, JavaScriptResult<T> typé, chemins de données d'événement et filtres déclarés.
security.declaredjs.snippet.label=Texte à copier
security.declaredjs.copy=Copier
security.declaredjs.viewport=Lire le viewport
security.declaredjs.command.label=Commande
security.declaredjs.lead=Déclarez du JavaScript dans une interface Java avec @JsDefinition et @JsExpression. Il est intégré au bundle lors du build, de sorte que le navigateur ne compile jamais de chaîne, et les appels renvoient des valeurs typées.
security.declaredjs.copy.ok=✅ "{0}" copié (JavaScriptResult<Boolean> = true)
security.declaredjs.copy.denied=⚠️ Le navigateur a refusé l'accès au presse-papiers (JavaScriptResult<Boolean> = false)
security.declaredjs.viewport.result=📐 {0} × {1} px, langue {2} (JavaScriptResult<Viewport>, un record Java)
security.declaredjs.demo1.heading=Résultats typés : copier dans le presse-papiers
security.declaredjs.demo1.desc=La promesse de la Clipboard API est résolue en Boolean côté serveur. Un objet JavaScript peut tout aussi bien devenir un record Java : la valeur est convertie avec Jackson.
security.declaredjs.command.placeholder=Saisissez puis appuyez sur Entrée
security.declaredjs.command.hint=Seule la touche Entrée atteint le serveur. Les autres touches sont filtrées dans le navigateur.
security.declaredjs.demo2.heading=Chemins de données d'événement et filtres déclarés
security.declaredjs.demo2.desc=Le filtre est déclaré une seule fois et créé avec un argument pour chaque écouteur. La valeur du champ voyage avec l'événement sous forme de chemin de propriété, que le navigateur lit sans rien compiler.
security.declaredjs.compare.before=Avant 25.4 (obsolète, nécessite 'unsafe-eval')
security.declaredjs.compare.after=25.4 (compatible CSP)
security.declaredjs.compare.heading=Ancien et nouveau
security.declaredjs.compare.desc=Les variantes avec chaîne fonctionnent toujours, mais setFilter(String) et addEventData(String) sont obsolètes depuis 25.4, et vaadin.csp=warn signale chaque site d'appel qui les utilise encore.
