# tooling
tooling.copilot.lead=Keine Live-Demo: Copilot ist die Demo. Diese App läuft im Entwicklungsmodus. Öffne Copilot mit der Schaltfläche unten rechts und probiere die folgenden Funktionen auf den Seiten dieser Tour aus.
tooling.copilot.card1.title=Browserless-Tests aus dem UI-Testrekorder
tooling.copilot.card1.text=Der Rekorder schreibt jetzt zusätzlich zu TestBench-Tests auch Browserless-Tests und erfasst, ob Komponenten aktiviert oder deaktiviert sind.
tooling.copilot.card1.step1=Öffne Copilot, gehe zu Features und aktiviere den UI-Testrekorder (ein experimentelles Plugin).
tooling.copilot.card1.step2=Starte die Aufnahme und benutze dann eine Seite: Probiere die Button-Seite aus und klicke auf Save (UNTIL_RESPONSE).
tooling.copilot.card1.step3=Beende die Aufnahme und wähle Browserless als Ausgabe.
tooling.copilot.card1.step4=Kopiere den Test nach src/test/java und führe ./mvnw test aus.
tooling.copilot.card2.title=Kotlin-Views
tooling.copilot.card2.text=Copilot bearbeitet neben Java auch Kotlin-Views: Die Steuerelemente für Ausrichtung, Abstand, Padding und Größe, das Hinzufügen von Komponenten und Vorlagen sowie der Theme-Editor erzeugen idiomatischen Kotlin-Code, einschließlich Trailing Lambdas und Safe Calls.
tooling.copilot.card2.step1=Probiere es in einem Kotlin-Projekt aus: Diese Tour ist reines Java.
tooling.copilot.card3.title=Auto-responsive Form Layout
tooling.copilot.card3.text=Copilot wählt die passende API für das auto-responsive FormLayout, ohne unnötige addFormRow-Aufrufe.
tooling.copilot.card3.step1=Öffne Forms: Labels Aside.
tooling.copilot.card3.step2=Wähle unten das Form Layout aus und ändere in Copilot seine Spalten oder Labels.
tooling.copilot.card4.title=Component Gallery
tooling.copilot.card4.text=Die Ansicht „All Components“ ist jetzt die Component Gallery. Sie folgt dem Theme deiner Anwendung, ist leichter zu navigieren und importiert alle deine eigenen Komponenten auf einmal in die UI-Bibliothek.
tooling.copilot.card4.step1=Öffne Copilot und ziehe eine Komponente aus der Component Gallery auf eine beliebige Seite.
tooling.copilot.card5.title=CMD/STRG-Drilldown
tooling.copilot.card5.text=Halte CMD (macOS) oder STRG gedrückt und fahre mit der Maus darüber, um verschachtelte Komponenten auszuwählen. Copilot kommt auch mit Komponenten zurecht, die dein Code implizit hinzufügt.
tooling.copilot.card5.step1=Halte auf der Grid-Seite CMD/STRG gedrückt und fahre über das Grid, um eine einzelne Spalte zu erreichen.
tooling.copilot.card6.title=Optimistische Updates (experimentell)
tooling.copilot.card6.text=Änderungen erscheinen sofort, noch bevor der Server sie bestätigt. Aktiviere die Funktion unter den experimentellen Features von Copilot.
tooling.copilot.card6.step1=Aktiviere unter Features die optimistischen Updates.
tooling.copilot.card6.step2=Ändere auf der Button-Seite einen Button-Text und sieh zu, wie er sich sofort aktualisiert.
tooling.copilot.card7.title=Neues Onboarding und neue Anmeldung
tooling.copilot.card7.text=Ein überarbeiteter Onboarding-Ablauf und ein neuer Anmeldedialog ermöglichen die Anmeldung über den Lizenzprüfer, und ein Menüindikator zeigt an, wenn eine neue Version Release Notes hat. Mit CMD + Enter speicherst du Kommentare.
tooling.hood.lead=Änderungen, die keine Demo brauchen, aber beim Upgrade wichtig sind.
tooling.hood.card1.title=Spring Boot 4.2 und Node.js 26
tooling.hood.card1.text=Spring Boot 4.2 ist die unterstützte Version dieses Minor-Releases. Node.js 26 ist das Minimum: Ist dein globales Node.js älter, lädt Vaadin Node.js 26 nach ~/.vaadin herunter. Genau das ist passiert, als diese App zum ersten Mal ihr Dev-Bundle gebaut hat.
tooling.hood.card2.title=Schlankeres vaadin-spring
tooling.hood.card2.text=vaadin-spring bringt Spring MVC, Spring WebSocket und Hibernate Validator nicht mehr mit. Der Spring-Boot-Starter fügt die Starter für WebSocket und Validierung hinzu, sodass Boot-Apps wie diese weiter funktionieren. Reine Spring-Apps deklarieren sie selbst.
tooling.hood.card3.title=Hilla: TypeScript wird in Java generiert
tooling.hood.card3.text=TypeScript für Endpoints und Modelle wird von Java im selben Lauf generiert, der deine Klassen scannt, ohne Node.js-Prozess. Mit TypeScriptProcessor können Build-Tools ihn ausführen. Entfernt wurden: die Konfiguration des Generator-Plugins, nodeCommand und hilla-openapi.json. Formularmodelle sind jetzt Konstanten aus @vaadin/hilla-models.
tooling.hood.card4.title=CDI und Quarkus auf der Flow-Version
tooling.hood.card4.text=Das CDI-Add-on und die Quarkus-Extension werden im Flow-Repository entwickelt und als 25.4.x versioniert. Group- und Artifact-IDs bleiben unverändert.
tooling.hood.card5.title=Observability Kit auf Lifecycle Events
tooling.hood.card5.text=Metriken zu Navigation, Requests und Session-Locks werden aus den neuen Lifecycle Events von Flow gemessen, und die Zeitmessung von Browser-Interaktionen funktioniert in Produktion und mit WebSocket-Push. Die Events selbst findest du auf der Seite Lifecycle Events.
tooling.hood.card6.title=Breaking Changes
tooling.hood.card6.text=Prüfe diese Punkte beim Upgrade:
tooling.hood.card6.step1=Die i18n-Property der Web Components ist undefined, bis du sie setzt.
tooling.hood.card6.step2=Ein Slotted-Titel einer Card hat jetzt Vorrang vor cardTitle.
tooling.hood.card6.step3=Die Kalenderzellen des Date Picker und die Body-Zellen des Grid haben ein neues DOM: Prüfe eigenes CSS und Tests.
tooling.hood.card6.step4=Bidirektionale Signal-Bindings erfordern jetzt einen Write-Callback.
tooling.hood.card6.step5=Stringbasierte Event-Daten und Filter sind veraltet (siehe Declared JavaScript).
tooling.hood.versions=Diese App läuft mit Flow {0} auf Spring Boot {1} und Java {2}.
summary.CopilotView=Kotlin-Views, Browserless-Tests aus dem Rekorder, Component Gallery und mehr. Eine geführte Tour.
summary.UnderTheHoodView=Hilla-TypeScript in Java, schlankere Spring-Abhängigkeiten, Node.js 26, Spring Boot 4.2, Breaking Changes.
