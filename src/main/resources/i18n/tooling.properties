# tooling
tooling.copilot.lead=No live demo here: Copilot is the demo. This app runs in development mode, so open Copilot with the button at the bottom right and try these on the pages of this tour.
tooling.copilot.card1.title=Browserless tests from the UI test recorder
tooling.copilot.card1.text=The recorder now writes Browserless tests in addition to TestBench tests, and records whether components are enabled or disabled.
tooling.copilot.card1.step1=Open Copilot, go to Features and enable the UI test recorder (an experimental plugin).
tooling.copilot.card1.step2=Start recording, then use a page: try the Button page and click Save (UNTIL_RESPONSE).
tooling.copilot.card1.step3=Stop recording and choose Browserless as the output.
tooling.copilot.card1.step4=Copy the test to src/test/java and run ./mvnw test.
tooling.copilot.card2.title=Kotlin views
tooling.copilot.card2.text=Copilot edits Kotlin views as well as Java: alignment, gap, padding and sizing controls, adding components and templates, and the theme editor generate idiomatic Kotlin, including trailing lambdas and safe calls.
tooling.copilot.card2.step1=Try it in a Kotlin project: this tour is Java only.
tooling.copilot.card3.title=Auto-responsive Form Layout
tooling.copilot.card3.text=Copilot picks the right API for auto-responsive FormLayout, without unnecessary addFormRow calls.
tooling.copilot.card3.step1=Open Forms: Labels Aside.
tooling.copilot.card3.step2=Select the Form Layout at the bottom and change its columns or labels in Copilot.
tooling.copilot.card4.title=Component Gallery
tooling.copilot.card4.text=The All Components view is now the Component Gallery. It follows your application theme, is easier to navigate, and imports all your custom components into the UI library at once.
tooling.copilot.card4.step1=Open Copilot and drag a component from the Component Gallery onto any page.
tooling.copilot.card5.title=CMD/CTRL drilldown
tooling.copilot.card5.text=Hold CMD (macOS) or CTRL while hovering to drill down and select nested components. Copilot also handles components that your code adds implicitly.
tooling.copilot.card5.step1=On the Grid page, hold CMD/CTRL and hover the grid to reach a single column.
tooling.copilot.card6.title=Optimistic updates (experimental)
tooling.copilot.card6.text=Edits show up immediately, before the server confirms them. Enable it among Copilot's experimental features.
tooling.copilot.card6.step1=Enable optimistic updates under Features.
tooling.copilot.card6.step2=Change a button text on the Button page and watch it update instantly.
tooling.copilot.card7.title=New onboarding and sign-in
tooling.copilot.card7.text=A redesigned onboarding flow and sign-in dialog let you sign in through the license checker, and a menu indicator shows when a new version has release notes. CMD + Enter saves comments.
tooling.hood.lead=Changes that need no demo but matter when you upgrade.
tooling.hood.card1.title=Spring Boot 4.2 and Node.js 26
tooling.hood.card1.text=Spring Boot 4.2 is the supported version of this minor. Node.js 26 is the minimum: if your global Node.js is older, Vaadin downloads Node.js 26 into ~/.vaadin. That's what happened when this app first built its dev bundle.
tooling.hood.card2.title=Leaner vaadin-spring
tooling.hood.card2.text=vaadin-spring no longer brings Spring MVC, Spring WebSocket or Hibernate Validator. The Spring Boot starter adds the websocket and validation starters, so Boot apps like this one keep working. Plain Spring apps declare them themselves.
tooling.hood.card3.title=Hilla: TypeScript generated in Java
tooling.hood.card3.text=Endpoint and model TypeScript is generated by Java in the same run that scans your classes, with no Node.js process. TypeScriptProcessor lets build tools run it. Removed: the generator plugin configuration, nodeCommand and hilla-openapi.json. Form models are now @vaadin/hilla-models constants.
tooling.hood.card4.title=CDI and Quarkus on the Flow version
tooling.hood.card4.text=The CDI add-on and the Quarkus extension are developed in the Flow repository and versioned as 25.4.x. Group and artifact IDs are unchanged.
tooling.hood.card5.title=Observability Kit on lifecycle events
tooling.hood.card5.text=Navigation, request and session lock metrics are measured from Flow's new lifecycle events, and browser interaction timing works in production and with WebSocket push. See the Lifecycle Events page for the events themselves.
tooling.hood.card6.title=Breaking changes
tooling.hood.card6.text=Check these when you upgrade:
tooling.hood.card6.step1=The web component i18n property is undefined until you set it.
tooling.hood.card6.step2=A slotted Card title now wins over cardTitle.
tooling.hood.card6.step3=Date Picker calendar cells and Grid body cells have a new DOM: check custom CSS and tests.
tooling.hood.card6.step4=Two-way signal bindings now require a write callback.
tooling.hood.card6.step5=String-based event data and filters are deprecated (see Declared JavaScript).
tooling.hood.versions=This app runs Flow {0} on Spring Boot {1} and Java {2}.
summary.CopilotView=Kotlin views, Browserless tests from the recorder, Component Gallery and more. A guided tour.
summary.UnderTheHoodView=Hilla TypeScript in Java, leaner Spring dependencies, Node.js 26, Spring Boot 4.2, breaking changes.
