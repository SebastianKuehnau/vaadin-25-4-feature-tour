components.accessibility.openConfirm=Ouvrir la boîte de confirmation
components.accessibility.headings.heading=Niveaux de titre et aria-describedby
components.accessibility.headings.desc=Dialog, Confirm Dialog et Card affichent leur titre avec le niveau de titre que vous choisissez, ce qui permet aux utilisateurs de lecteurs d'écran de naviguer par titres. Le dialogue annonce aussi sa description via aria-describedby.
