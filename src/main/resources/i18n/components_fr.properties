components.grid.menu.hidden=Colonne {0} masquée
components.grid.sort.heading=Recherche par propriété de tri et menu contextuel sensible à la colonne
components.grid.sort.desc=Choisissez une propriété de tri pour trier via la colonne trouvée correspondante. Faites un clic droit sur une cellule : le menu est construit pour la colonne cliquée, à partir de DynamicContentContext.
components.labels.lead=La variante de thème LABEL_ASIDE place le libellé d'un champ à côté de la saisie plutôt qu'au-dessus, de façon autonome, sans Form Layout. Form Layout reçoit un réglage d'alignement du texte des libellés pour son mode libellés sur le côté.
