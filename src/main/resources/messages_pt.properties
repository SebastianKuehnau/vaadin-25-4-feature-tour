home.title=Novidades do Vaadin 25.4
home.lead=Um tour prático pela versão: segurança, APIs do framework, componentes, IA e ferramentas. Cada página é uma demo ao vivo com o código Java por trás.
area.security.lead=Execução sob uma Content Security Policy rígida, com JavaScript declarado em Java em vez de enviado como strings.
area.flow.lead=Novos componentes HTML, downloads a partir de qualquer componente, menus hierárquicos, eventos de ciclo de vida e pequenas melhorias de API.
area.components.lead=A prévia do PDF Viewer, rótulos ao lado, selecionar tudo, seleção de texto e mais melhorias em componentes existentes.
area.ai.lead=Paginação para o AI Grid e um Message Input mais inteligente.
area.tooling.lead=Novidades do Copilot e mudanças internas que não precisam de demo.
