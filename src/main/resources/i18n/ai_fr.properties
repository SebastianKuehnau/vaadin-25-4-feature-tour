# ai
ai.page.powered=Propulsé par {0} via Spring AI. Vos prompts sont envoyés à {1}.
ai.page.noLlm=Aucun LLM configuré. Définissez OPENAI_API_KEY (ou AI_PROVIDER=anthropic et ANTHROPIC_API_KEY) et redémarrez l'application pour essayer cette démo en direct.
ai.grid.lead=Le AI Grid ne charge plus tout le résultat de la requête du LLM. Il pagine à la demande via votre DatabaseProvider, si bien que « afficher toutes les commandes » fonctionne aussi sur de grandes tables.
ai.grid.empty=Demandez par exemple : affiche toutes les commandes de 2026, les plus récentes d'abord
ai.grid.logHint=Les demandes de pages de la grille apparaissent ici. Faites défiler la grille pour en charger davantage.
ai.grid.thinking=⏳ Réflexion en cours… (l'envoi est désactivé pendant ce temps)
ai.grid.done=✅ Terminé
ai.grid.demo1.heading=Chargement différé via votre DatabaseProvider
ai.grid.demo1.desc=La table des ventes compte 1 500 lignes. Demandez-les toutes et faites défiler : la grille demande au provider une page à la fois ainsi que le nombre total. Pendant que le LLM travaille, l'orchestrateur désactive l'envoi.
ai.grid.demo2.heading=Message Input : submitDisabled
ai.grid.demo2.desc=La même API pour vos propres flux, sans LLM. Tant que l'envoi est désactivé, l'utilisateur peut continuer à saisir le message suivant, contrairement à setEnabled(false).
ai.grid.busy=Requête en cours
summary.AiGridView=Le AI Grid pagine via votre DatabaseProvider ; Message Input bloque les envois tant qu'il est occupé.
