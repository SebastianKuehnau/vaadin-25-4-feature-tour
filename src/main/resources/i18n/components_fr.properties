components.accessibility.tabs.desc=La validation a échoué sur un champ situé dans un autre onglet ? Trouvez l'onglet qui le contient, même s'il est imbriqué plus profondément, et basculez dessus. TabSheet a aussi reçu removeAll().
components.accessibility.notification.show=Afficher la notification
components.accessibility.notification.text=3 éléments enregistrés
components.accessibility.notification.desc=Relire le texte d'une notification, pratique dans les tests et pour la réafficher.
components.accessibility.slider.volume=Volume
components.accessibility.slider.balance=Balance
components.accessibility.slider.helper=Texte d'aide au-dessus du slider
components.accessibility.slider.heading=Variantes de thème du Slider
components.accessibility.slider.desc=HELPER_ABOVE place le texte d'aide entre le libellé et le slider, LABEL_ASIDE place le libellé à côté.
components.button.lead=DisableOnClickMode.UNTIL_RESPONSE désactive le bouton au clic et le réactive automatiquement avec la réponse suivante, une fois les listeners de clic exécutés. Chaque listener prend ici 2 secondes.
components.button.save.none=Enregistrer (sans protection)
components.button.save.with=Enregistrer ({0})
components.button.saves.one={0} enregistrement
components.button.saves.other={0} enregistrements
components.button.disabledUntil={0} · reste désactivé jusqu''à setEnabled(true)
components.button.col1.title=Avant : aucune protection
components.button.col1.text=Double-clic : les deux clics sont mis en file d'attente, donc l'enregistrement a lieu deux fois.
components.button.col2.title=Avant : setDisableOnClick(true)
components.button.col2.text=Sûr, mais vous devez réactiver le bouton vous-même, y compris en cas d'erreur.
components.button.col3.title=25.4 : UNTIL_RESPONSE
components.button.col3.text=Désactivé pendant que le serveur travaille, réactivé par la réponse.
components.button.heading=Double-cliquez sur chaque bouton
components.button.desc=Les trois listeners attendent 2 secondes pour simuler un enregistrement lent.
components.grid.lead=Trois petites améliorations : sélectionner des lignes en cliquant dessus en mode de sélection multiple, retrouver une colonne via sa propriété de tri, et des menus contextuels qui connaissent la colonne cliquée.
