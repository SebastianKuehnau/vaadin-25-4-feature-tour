# tooling
tooling.copilot.lead=Aquí no hay demo en vivo: Copilot es la demo. Esta aplicación se ejecuta en modo de desarrollo, así que abre Copilot con el botón de abajo a la derecha y prueba esto en las páginas de este recorrido.
tooling.copilot.card1.title=Pruebas Browserless desde el grabador de pruebas de UI
tooling.copilot.card1.text=El grabador ahora escribe pruebas Browserless además de pruebas TestBench, y registra si los componentes están habilitados o deshabilitados.
tooling.copilot.card1.step1=Abre Copilot, ve a Features y activa el grabador de pruebas de UI (un plugin experimental).
tooling.copilot.card1.step2=Inicia la grabación y usa una página: prueba la página Button y haz clic en Save (UNTIL_RESPONSE).
tooling.copilot.card1.step3=Detén la grabación y elige Browserless como salida.
tooling.copilot.card1.step4=Copia la prueba en src/test/java y ejecuta ./mvnw test.
tooling.copilot.card2.title=Vistas en Kotlin
tooling.copilot.card2.text=Copilot edita vistas en Kotlin además de Java: los controles de alineación, espaciado, padding y tamaño, la adición de componentes y plantillas, y el editor de temas generan Kotlin idiomático, incluidas las lambdas finales y las llamadas seguras.
tooling.copilot.card2.step1=Pruébalo en un proyecto Kotlin: este recorrido es solo Java.
tooling.copilot.card3.title=Form Layout auto-responsive
tooling.copilot.card3.text=Copilot elige la API adecuada para el FormLayout auto-responsive, sin llamadas innecesarias a addFormRow.
tooling.copilot.card3.step1=Abre Forms: Labels Aside.
tooling.copilot.card3.step2=Selecciona el Form Layout de abajo y cambia sus columnas o etiquetas en Copilot.
tooling.copilot.card4.title=Component Gallery
tooling.copilot.card4.text=La vista All Components es ahora la Component Gallery. Sigue el tema de tu aplicación, es más fácil de navegar e importa de una vez todos tus componentes personalizados a la biblioteca de UI.
tooling.copilot.card4.step1=Abre Copilot y arrastra un componente de la Component Gallery a cualquier página.
tooling.copilot.card5.title=Drilldown con CMD/CTRL
tooling.copilot.card5.text=Mantén pulsado CMD (macOS) o CTRL mientras pasas el ratón para profundizar y seleccionar componentes anidados. Copilot también gestiona los componentes que tu código añade de forma implícita.
tooling.copilot.card5.step1=En la página Grid, mantén pulsado CMD/CTRL y pasa el ratón por el grid para llegar a una sola columna.
tooling.copilot.card6.title=Actualizaciones optimistas (experimental)
tooling.copilot.card6.text=Los cambios se muestran de inmediato, antes de que el servidor los confirme. Actívalo entre las funciones experimentales de Copilot.
tooling.copilot.card6.step1=Activa las actualizaciones optimistas en Features.
tooling.copilot.card6.step2=Cambia el texto de un botón en la página Button y observa cómo se actualiza al instante.
tooling.copilot.card7.title=Nuevo onboarding e inicio de sesión
tooling.copilot.card7.text=Un flujo de onboarding rediseñado y un nuevo diálogo de inicio de sesión permiten iniciar sesión mediante el comprobador de licencias, y un indicador en el menú avisa cuando una nueva versión tiene notas de la versión. CMD + Enter guarda los comentarios.
tooling.hood.lead=Cambios que no necesitan demo, pero que importan al actualizar.
tooling.hood.card1.title=Spring Boot 4.2 y Node.js 26
tooling.hood.card1.text=Spring Boot 4.2 es la versión compatible de este minor. Node.js 26 es el mínimo: si tu Node.js global es más antiguo, Vaadin descarga Node.js 26 en ~/.vaadin. Eso fue lo que ocurrió cuando esta aplicación construyó por primera vez su dev bundle.
tooling.hood.card2.title=vaadin-spring más ligero
tooling.hood.card2.text=vaadin-spring ya no incluye Spring MVC, Spring WebSocket ni Hibernate Validator. El starter de Spring Boot añade los starters de websocket y validación, por lo que las aplicaciones Boot como esta siguen funcionando. Las aplicaciones Spring simples los declaran ellas mismas.
tooling.hood.card3.title=Hilla: TypeScript generado desde Java
tooling.hood.card3.text=El TypeScript de endpoints y modelos lo genera Java en la misma ejecución que escanea tus clases, sin proceso de Node.js. TypeScriptProcessor permite que las herramientas de compilación lo ejecuten. Eliminados: la configuración del plugin generador, nodeCommand y hilla-openapi.json. Los modelos de formulario son ahora constantes de @vaadin/hilla-models.
tooling.hood.card4.title=CDI y Quarkus con la versión de Flow
tooling.hood.card4.text=El add-on de CDI y la extensión de Quarkus se desarrollan en el repositorio de Flow y se versionan como 25.4.x. Los group y artifact ID no cambian.
tooling.hood.card5.title=Observability Kit sobre eventos de ciclo de vida
tooling.hood.card5.text=Las métricas de navegación, peticiones y bloqueos de sesión se miden a partir de los nuevos eventos de ciclo de vida de Flow, y la medición de interacciones del navegador funciona en producción y con push por WebSocket. Consulta la página Lifecycle Events para ver los eventos en sí.
tooling.hood.card6.title=Cambios incompatibles
tooling.hood.card6.text=Comprueba esto al actualizar:
tooling.hood.card6.step1=La propiedad i18n de los web components es undefined hasta que la establezcas.
tooling.hood.card6.step2=Un título de Card en un slot ahora prevalece sobre cardTitle.
tooling.hood.card6.step3=Las celdas del calendario del Date Picker y las celdas del cuerpo del Grid tienen un DOM nuevo: revisa tu CSS personalizado y tus pruebas.
tooling.hood.card6.step4=Los enlaces de signals bidireccionales ahora requieren un callback de escritura.
tooling.hood.card6.step5=Los datos de eventos y los filtros basados en cadenas están obsoletos (consulta Declared JavaScript).
tooling.hood.versions=Esta aplicación se ejecuta con Flow {0} sobre Spring Boot {1} y Java {2}.
summary.CopilotView=Vistas en Kotlin, pruebas Browserless del grabador, Component Gallery y más. Un recorrido guiado.
summary.UnderTheHoodView=TypeScript de Hilla en Java, dependencias de Spring más ligeras, Node.js 26, Spring Boot 4.2, cambios incompatibles.
