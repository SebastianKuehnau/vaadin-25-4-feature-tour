# components
summary.AccessibilityView=Heading levels, aria-describedby, camera capture, findTabContaining(), Slider variants.
summary.ButtonView=DisableOnClickMode.UNTIL_RESPONSE re-enables the button when the server is done.
summary.GridView=Row click in multi-select, getColumnBySortProperty(), column-aware context menus.
summary.LabelsAsideView=LABEL_ASIDE on fields, and label text alignment in Form Layout.
summary.MultiSelectView=A Select all button that also selects just the filtered items.
summary.NowStableView=Switch and Breadcrumbs are production ready: no feature flags.
summary.PdfViewerView=Show PDFs in the app: from a URL or a DownloadHandler, with navigation, zoom and toolbar actions.
summary.TextSelectionView=setSelectionRange(), selectAll() and setCursorPosition() from the server.
