# flow
summary.DownloadsView=Download.onClick() sur n'importe quel composant, nouveaux onglets, téléchargements depuis un Button et des éléments de menu.
summary.LifecycleView=Événements de début et de fin des requêtes et des navigations, plus les événements d'aller-retour côté client.
summary.MediaView=Video, Audio et Source depuis un DownloadHandler avec recherche dans le média, et NativeForm.
summary.MenusView=@Menu(parent) et getMenuEntriesTree() construisent la navigation latérale de cette application.
summary.SmallWinsView=Convertisseurs null-safe, findAncestor(predicate), fuseau horaire du navigateur, URL avec paramètres de requête.
summary.StylingView=@StyleSheet(layer) pour des valeurs par défaut remplaçables, @JavaScript(type = MODULE) à l'exécution.
flow.downloads.lead=Lancer un téléchargement, ou ouvrir un contenu dans un nouvel onglet, d'un clic sur n'importe quel composant. Plus besoin d'entourer un bouton d'un Anchor : le composant conserve son apparence, sa gestion du clavier et ses écouteurs de clic.
flow.downloads.status.none=Rien n'a encore été téléchargé.
flow.downloads.status.served={0} ✅ Fourni : {1}
flow.downloads.status.failed={0} ❌ Échec : {1}
flow.downloads.card.title=Rapport de version
flow.downloads.card.subtitle=features-25-4.csv · cliquer n'importe où sur la carte
flow.downloads.card.heading=N'importe quel composant : une Card
flow.downloads.card.desc=Le téléchargement démarre dans le gestionnaire de clic du navigateur lui-même, donc sans aller-retour supplémentaire. Le contenu est créé à la demande, et whenComplete signale le succès ou l'échec côté serveur.
flow.downloads.newtab.poster=Ouvrir l'affiche dans un nouvel onglet
flow.downloads.newtab.docs=Ouvrir la documentation 25.4
flow.downloads.newtab.heading=Ouvrir dans un nouvel onglet
flow.downloads.newtab.desc=DownloadTarget.NEW_TAB ouvre le contenu d'un gestionnaire ou une URL dans un nouvel onglet. L'onglet s'ouvre dans le gestionnaire de clic, donc les bloqueurs de fenêtres publicitaires le laissent passer, contrairement à Page.open() après un aller-retour.
flow.downloads.newtab.note=Bêta 2 : les notes de version mentionnent OpenInNewTab.onClick(), mais cette classe publique n'existe pas encore. Download.onClick(component, handler, DownloadTarget.NEW_TAB) fait la même chose aujourd'hui.
flow.downloads.button.label=Exporter en CSV
flow.downloads.button.desc=Le raccourci pour le cas le plus courant.
flow.downloads.menu.export=Exporter
flow.downloads.menu.csv=En CSV
flow.downloads.menu.poster=Image de l'affiche
flow.downloads.menu.target=Clic droit ici
flow.downloads.menu.report=Télécharger le rapport
flow.downloads.menu.other=Faire autre chose
flow.downloads.menu.regular=Les éléments de menu ordinaires fonctionnent toujours.
flow.downloads.menu.heading=Éléments de Context Menu et de Menu Bar
flow.downloads.menu.desc=Les éléments de menu peuvent eux aussi lancer des téléchargements, depuis une barre de menus ou un menu contextuel.
flow.media.lead=De nouveaux composants HTML pour les lecteurs multimédias et les formulaires natifs du navigateur. Les médias sont servis par un DownloadHandler qui répond aux requêtes HTTP Range, ce qui permet aux lecteurs de se déplacer dans le média.
flow.media.rangeLog.empty=Les requêtes du lecteur apparaissent ici.
flow.media.rangeLog.whole=fichier entier
flow.media.seek=Aller à 0:08
flow.media.video.heading=Vidéo avec recherche
flow.media.video.desc=Deux sources, WebM et MP4, toutes deux servies depuis le classpath. Faites glisser la barre de temps ou avancez : le lecteur demande une plage d'octets et reçoit 206 Partial Content au lieu du fichier entier.
flow.media.audio.heading=Audio
flow.media.audio.desc=La même API pour l'audio : un son montant, avec une source Ogg et une source MP3 au choix.
flow.media.form.username=Nom d'utilisateur
flow.media.form.password=Mot de passe
flow.media.form.login=Se connecter
flow.media.form.heading=Un formulaire de connexion natif
flow.media.form.desc=Le navigateur soumet lui-même un <form> natif, si bien que les gestionnaires de mots de passe le reconnaissent et proposent d'enregistrer et de remplir les identifiants. Ici, la réponse s'affiche dans un cadre, ce qui laisse cette page ouverte. Avec Spring Security, envoyez plutôt à son URL de traitement de la connexion.
flow.lifecycle.lead=Le bus d'événements du service introduit en 25.3 signale désormais aussi le début et la fin de chaque requête et de chaque navigation, avec le résultat, la durée et le gestionnaire. Dans le navigateur, le moteur client déclenche des événements pour chaque requête et chaque message du serveur. Observability Kit utilise les mêmes événements.
flow.lifecycle.browser.waiting=Navigateur : en attente de la première requête…
flow.lifecycle.browser.stats=Navigateur : {0} requêtes, aller-retour moyen {1} ms, dernière {2} · {3} messages du serveur (réponses et push)
flow.lifecycle.browser.last={0} ms ({1}, tentative {2})
flow.lifecycle.postpone=Reporter la prochaine navigation hors de cette page
flow.lifecycle.tile.requests=Requêtes démarrées / terminées
flow.lifecycle.tile.avgRequest=Requête moyenne
flow.lifecycle.tile.navigations=Navigations
flow.lifecycle.tile.avgNavigation=Navigation moyenne
flow.lifecycle.tile.rpc=Appels RPC
flow.lifecycle.col.time=Heure
flow.lifecycle.col.event=Événement
flow.lifecycle.col.handler=Gestionnaire / emplacement
flow.lifecycle.col.outcome=Résultat
flow.lifecycle.col.duration=Durée
flow.lifecycle.dashboard.heading=Votre session, en direct
flow.lifecycle.dashboard.desc=Un VaadinServiceInitListener enregistre les événements de chaque session dès le démarrage, si bien que ce tableau de bord affiche aussi les navigations qui ont quitté cette page. La première requête d'un chargement de page démarre avant l'existence d'une session ; elle est donc comptée à sa fin, mais pas à son début.
flow.lifecycle.nav.step=Naviguer avec ?step=n
flow.lifecycle.nav.broken=Naviguer vers une route qui échoue
flow.lifecycle.nav.home=Aller à l'accueil (revenir avec Précédent)
flow.lifecycle.playground.heading=Générer quelques navigations
flow.lifecycle.playground.desc=Chaque type de résultat : terminée, échouée (la vue d'erreur s'affiche) et reportée lorsque la case est cochée. Revenez sur cette page après l'avoir quittée pour voir les événements survenus entre-temps.
flow.lifecycle.browser.heading=Aller-retour, mesurés dans le navigateur
flow.lifecycle.browser.desc=window.Vaadin.Flow.clients[appId].events déclenche vaadin-request et vaadin-server-message. Le script est une @JsDefinition et écrit directement dans la page : signaler chaque aller-retour au serveur provoquerait un nouvel aller-retour.
flow.lifecycle.postponed.notification=Navigation reportée. Cherchez le résultat 'postponed'.
flow.menus.lead=MenuConfiguration.getMenuEntriesTree() renvoie le menu sous forme d'arbre plutôt que de liste plate. La navigation latérale de cette application en est issue : chaque page nomme sa zone avec @Menu(parent = ...).
flow.menus.tree.summary={0} entrées de menu dans getMenuEntries(), {1} racines dans getMenuEntriesTree().
flow.menus.tree.heading=L'arbre de menus de cette application
flow.menus.tree.desc=Voici ce que renvoie getMenuEntriesTree() à l'instant. Le tiroir de gauche affiche le même arbre de façon récursive dans des SideNavItem, si bien qu'une nouvelle page apparaît d'elle-même dans le bon groupe.
flow.menus.parent.count={0} pages sont imbriquées sous {1}.
flow.menus.parent.missing=Zone Security introuvable.
flow.menus.parent.heading=Imbrication avec @Menu(parent)
flow.menus.parent.desc=Les pages ont ici des URL plates comme /strict-csp ; la hiérarchie des routes les placerait donc toutes au niveau supérieur. @Menu(parent = ...) les déplace sous leur zone dans le menu uniquement : les URL, la navigation et la liste plate getMenuEntries() restent inchangées. Sans cela, les entrées s'imbriquent selon @RouteParent ou selon le préfixe de l'URL.
flow.smallwins.lead=De petits ajouts qui suppriment du code répétitif que vous avez sans doute déjà écrit vous-même.
flow.smallwins.birthDate.label=Date de naissance (aaaa-mm-jj)
flow.smallwins.birthDate.error=Utiliser le format 2026-11-20
flow.smallwins.converter.heading=Convertisseurs null-safe dans Binder
flow.smallwins.converter.desc=Saisissez une date, puis videz le champ. Le champ vide devient null dans le bean au lieu de provoquer une erreur d'analyse, et une valeur null dans le bean vide le champ. Les fonctions ne voient jamais null ni la chaîne vide.
flow.smallwins.ancestor.button=Dans quelle section suis-je ?
flow.smallwins.ancestor.found=Ancêtre le plus proche avec data-area : {0} (un {1})
flow.smallwins.ancestor.none=Aucun ancêtre de ce type
flow.smallwins.ancestor.outer=Panneau extérieur
flow.smallwins.ancestor.desc=findAncestor(Class) recherche par type. La nouvelle surcharge accepte n'importe quel prédicat et remonte la chaîne des parents.
flow.smallwins.tz.text=Fuseau du navigateur : {0} · heure du navigateur : {1} · fuseau du serveur : {2}
flow.smallwins.tz.heading=Le fuseau horaire du navigateur sous forme de ZoneId
flow.smallwins.tz.desc=ExtendedClientDetails fournit désormais un ZoneId et la date-heure locale du navigateur, prêts pour java.time.
flow.smallwins.url.anchor=L'ouvrir
flow.smallwins.url.desc=Construire un lien vers une route, chaîne de requête comprise, sans concaténer soi-même des chaînes.
flow.styling.lead=Charger une feuille de style dans une couche de cascade CSS, pour que vos propres styles l'emportent toujours, et charger un module ES à l'exécution sans l'empaqueter.
flow.styling.layer.styled=Stylé uniquement par la couche : ambre, comme le dit la couche.
flow.styling.layer.conflict=La couche dit rouge avec le sélecteur #layer-demo div.layer-box.app-styled.app-styled. L'application dit vert avec .layer-box.app-styled. Le vert l'emporte.
flow.styling.layer.heading=Couches de cascade : des valeurs par défaut toujours remplaçables
flow.styling.layer.desc=Les règles d'une couche ont une priorité plus faible que celles qui sont hors de toute couche, quelle que soit la spécificité. Idéal pour un thème ou l'apparence par défaut d'un module complémentaire : les styles de l'application le remplacent sans guerre de spécificité.
flow.styling.module.heading=Modules ES à l'exécution
flow.styling.module.desc=L'horloge est un élément personnalisé provenant de js/tour-clock.js, un simple module ES servi comme ressource statique. type = MODULE le charge à l'exécution sous la forme <script type="module">, donc il ne passe pas par Vite. Utilisez @JsModule pour les fichiers qui doivent être empaquetés.
