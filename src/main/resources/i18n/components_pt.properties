summary.AccessibilityView=Níveis de título, aria-describedby, captura pela câmera, findTabContaining(), variantes do Slider.
summary.ButtonView=DisableOnClickMode.UNTIL_RESPONSE reativa o botão quando o servidor termina.
summary.GridView=Clique na linha na seleção múltipla, getColumnBySortProperty(), menus de contexto cientes da coluna.
summary.LabelsAsideView=LABEL_ASIDE nos campos e alinhamento do texto dos rótulos no Form Layout.
summary.MultiSelectView=Um botão Selecionar tudo que também seleciona apenas os itens filtrados.
summary.NowStableView=Switch e Breadcrumbs estão prontos para produção: sem feature flags.
