# security (it)
summary.StrictCspView=vaadin.csp=off|warn|strict: trovare e rimuovere il JavaScript inviato come stringa.
security.strictcsp.legacy.button=Legacy: executeJs(String)
security.strictcsp.declared.button=Dichiarato: executeJs(TextJs.class)
security.strictcsp.target.waiting=In attesa di JavaScript…
security.strictcsp.lead=Flow ora può funzionare con una Content-Security-Policy basata su nonce senza 'unsafe-eval'. Imposta vaadin.csp=warn per trovare ogni chiamata che invia JavaScript come stringa, correggile e poi passa a strict.
security.strictcsp.note=Beta 2: Vaadin stesso invia ancora JavaScript come stringa in alcuni punti, come i filtri di evento dei listener di doppio e singolo clic e le scorciatoie da tastiera. In modalità strict questi generano un'eccezione finché non vengono modificati, quindi prova strict prima su una copia della tua app e per ora mantieni warn.
security.strictcsp.mode.production=Modalità produzione. Riavvia con VAADIN_CSP=off|warn|strict per cambiare.
security.strictcsp.mode.development=Modalità sviluppo. Riavvia con VAADIN_CSP=off|warn|strict per cambiare.
security.strictcsp.table.off.all=Predefinito. Non viene controllato nulla.
security.strictcsp.table.off.prod=Nessun header.
security.strictcsp.table.warn.all=Il JavaScript come stringa viene eseguito e ogni punto di chiamata viene registrato una volta con uno stack trace verso il tuo codice.
security.strictcsp.table.warn.prod=Come in sviluppo. Nessun header.
security.strictcsp.table.strict.all=Il JavaScript come stringa genera una CspViolationException, anche in modalità sviluppo.
security.strictcsp.table.strict.prod=Invia anche un header Content-Security-Policy basato su nonce.
security.strictcsp.table.mode=Modalità
security.strictcsp.table.everywhere=Sviluppo e produzione
security.strictcsp.table.production=Solo produzione
security.strictcsp.mode.heading=La modalità corrente
security.strictcsp.mode.desc=La modalità vale sia per lo sviluppo sia per la produzione. L'unica differenza è l'header: in modalità sviluppo non viene inviato alcun header, perché il server di sviluppo e gli strumenti di sviluppo hanno bisogno di eval.
security.strictcsp.legacy.set=Impostato da una stringa, compilata nel browser
security.strictcsp.legacy.ran=Eseguito. In modalità warn, la prima chiamata da questa riga viene registrata qui sotto.
security.strictcsp.legacy.blocked=Bloccato: {0} (modalità strict)
security.strictcsp.declared.set=Impostato da JavaScript dichiarato dal bundle
security.strictcsp.declared.ran=Eseguito. Il JavaScript dichiarato non viene mai segnalato: nel browser non viene compilato nulla.
security.strictcsp.warnings.none=Nessun avviso ancora catturato.
security.strictcsp.legacy.heading=Una chiamata legacy accanto alla sua sostituta dichiarata
security.strictcsp.legacy.desc=Entrambi i pulsanti impostano il testo qui sotto. Il primo invia JavaScript come stringa, cosa che una policy strict blocca. Il secondo chiama un metodo di interfaccia il cui JavaScript viene incluso nel bundle in fase di build. Gli avvisi del logger del reporter CSP compaiono qui sotto man mano che vengono registrati.
summary.DeclaredJsView=@JsDefinition, JavaScriptResult<T> tipizzato, percorsi dei dati di evento e filtri dichiarati.
security.declaredjs.snippet.label=Testo da copiare
security.declaredjs.copy=Copia
security.declaredjs.viewport=Leggi viewport
security.declaredjs.command.label=Comando
security.declaredjs.lead=Dichiara JavaScript in un'interfaccia Java con @JsDefinition e @JsExpression. Viene incluso nel bundle in fase di build, quindi il browser non compila mai una stringa, e le chiamate restituiscono valori tipizzati.
security.declaredjs.copy.ok=✅ "{0}" copiato (JavaScriptResult<Boolean> = true)
security.declaredjs.copy.denied=⚠️ Il browser ha negato l'accesso agli appunti (JavaScriptResult<Boolean> = false)
security.declaredjs.viewport.result=📐 {0} × {1} px, lingua {2} (JavaScriptResult<Viewport>, un record Java)
security.declaredjs.demo1.heading=Risultati tipizzati: copia negli appunti
security.declaredjs.demo1.desc=La promise della Clipboard API viene risolta in un Boolean sul server. Un oggetto JavaScript può altrettanto bene diventare un record Java: il valore viene convertito con Jackson.
security.declaredjs.command.placeholder=Digita e premi Invio
security.declaredjs.command.hint=Solo Invio raggiunge il server. Gli altri tasti vengono filtrati nel browser.
security.declaredjs.demo2.heading=Percorsi dei dati di evento e filtri dichiarati
security.declaredjs.demo2.desc=Il filtro viene dichiarato una sola volta e creato con un argomento per ogni listener. Il valore del campo viaggia con l'evento come percorso di proprietà, che il browser legge senza compilare nulla.
security.declaredjs.compare.before=Prima di 25.4 (deprecato, richiede 'unsafe-eval')
security.declaredjs.compare.after=25.4 (sicuro per CSP)
security.declaredjs.compare.heading=Vecchio vs. nuovo
security.declaredjs.compare.desc=Le varianti con stringa funzionano ancora, ma setFilter(String) e addEventData(String) sono deprecati dalla 25.4, e vaadin.csp=warn segnala ogni punto di chiamata che li usa ancora.
