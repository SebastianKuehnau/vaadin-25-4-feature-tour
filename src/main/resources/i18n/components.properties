components.multiselect.inmemory.heading=Select all, or all filtered items
components.multiselect.inmemory.desc=Open the dropdown and press Select All. Then clear, type "land": the button turns into Select Filtered, and only the six matching countries are selected. The others keep their state.
components.multiselect.lazy.heading=Hidden with lazy data
components.multiselect.lazy.desc=The same setting on a combo box with a lazy data provider: the button stays hidden, because selecting all would mean fetching every item from the backend. isSelectAllButtonVisible() still returns {0}, it reports the setting, not the effective visibility.
