# flow
summary.DownloadsView=Download.onClick() su qualsiasi componente, nuove schede, download da Button e voci di menu.
summary.LifecycleView=Eventi di inizio e fine di richieste e navigazioni, più gli eventi di round trip lato client.
summary.MediaView=Video, Audio e Source da un DownloadHandler con ricerca nel flusso, e NativeForm.
summary.MenusView=@Menu(parent) e getMenuEntriesTree() costruiscono la navigazione laterale di questa app.
summary.SmallWinsView=Convertitori null-safe, findAncestor(predicate), fuso orario del browser, URL con parametri di query.
summary.StylingView=@StyleSheet(layer) per valori predefiniti sovrascrivibili, @JavaScript(type = MODULE) a runtime.
flow.downloads.lead=Avviare un download, o aprire un contenuto in una nuova scheda, con un clic su qualsiasi componente. Niente più Anchor attorno a un pulsante: il componente mantiene aspetto, gestione della tastiera e listener di clic.
flow.downloads.status.none=Ancora nessun download.
flow.downloads.status.served={0} ✅ Servito: {1}
flow.downloads.status.failed={0} ❌ Non riuscito: {1}
flow.downloads.card.title=Report della release
flow.downloads.card.subtitle=features-25-4.csv · clic in un punto qualsiasi della scheda
flow.downloads.card.heading=Qualsiasi componente: una Card
flow.downloads.card.desc=Il download parte nel gestore di clic del browser stesso, quindi non c'è alcun round trip aggiuntivo. Il contenuto viene creato in modo lazy e whenComplete segnala successo o errore sul server.
flow.downloads.newtab.poster=Apri il poster in una nuova scheda
flow.downloads.newtab.docs=Apri la documentazione 25.4
flow.downloads.newtab.heading=Aprire in una nuova scheda
flow.downloads.newtab.desc=DownloadTarget.NEW_TAB apre il contenuto di un handler o un URL in una nuova scheda. La scheda si apre nel gestore di clic, quindi i blocchi popup la lasciano passare, a differenza di Page.open() dopo un round trip.
flow.downloads.newtab.note=Beta 2: le note di rilascio citano OpenInNewTab.onClick(), ma questa classe pubblica non esiste ancora. Download.onClick(component, handler, DownloadTarget.NEW_TAB) fa lo stesso oggi.
flow.downloads.button.label=Esporta CSV
flow.downloads.button.desc=La scorciatoia per il caso più comune.
flow.downloads.menu.export=Esporta
flow.downloads.menu.csv=Come CSV
flow.downloads.menu.poster=Immagine del poster
flow.downloads.menu.target=Clic destro qui
flow.downloads.menu.report=Scarica il report
flow.downloads.menu.other=Fai qualcos'altro
flow.downloads.menu.regular=Le normali voci di menu continuano a funzionare.
flow.downloads.menu.heading=Voci di Context Menu e Menu Bar
flow.downloads.menu.desc=Anche le voci di menu possono avviare download, da una barra dei menu o da un menu contestuale.
flow.media.lead=Nuovi componenti HTML per i lettori multimediali e i moduli nativi del browser. I contenuti multimediali vengono serviti da un DownloadHandler che risponde alle richieste HTTP Range, così i lettori possono spostarsi nel flusso.
flow.media.rangeLog.empty=Qui compaiono le richieste del lettore.
flow.media.rangeLog.whole=file intero
flow.media.seek=Vai a 0:08
flow.media.video.heading=Video con ricerca
flow.media.video.desc=Due sorgenti, WebM e MP4, entrambe servite dal classpath. Trascina la barra del tempo o salta avanti: il lettore chiede un intervallo di byte e riceve 206 Partial Content invece del file intero.
flow.media.audio.heading=Audio
flow.media.audio.desc=La stessa API per l'audio: un tono crescente, con una sorgente Ogg e una MP3 tra cui scegliere.
flow.media.form.username=Nome utente
flow.media.form.password=Password
flow.media.form.login=Accedi
flow.media.form.heading=Un modulo di login nativo
flow.media.form.desc=Il browser invia da sé un <form> nativo, quindi i gestori di password lo riconoscono e propongono di salvare e compilare le credenziali. Qui la risposta va in un frame, così questa pagina resta aperta. Con Spring Security si invia invece al suo URL di elaborazione del login.
flow.lifecycle.lead=Il bus di eventi del servizio di 25.3 ora segnala anche inizio e fine di ogni richiesta e navigazione, con esito, durata e gestore. Nel browser, il motore client genera eventi per ogni richiesta e messaggio del server. Observability Kit usa gli stessi eventi.
flow.lifecycle.browser.waiting=Browser: in attesa della prima richiesta…
flow.lifecycle.browser.stats=Browser: {0} richieste, round trip medio {1} ms, ultima {2} · {3} messaggi del server (risposte e push)
flow.lifecycle.browser.last={0} ms ({1}, tentativo {2})
flow.lifecycle.postpone=Posticipa la prossima navigazione fuori da questa pagina
flow.lifecycle.tile.requests=Richieste avviate / terminate
flow.lifecycle.tile.avgRequest=Richiesta media
flow.lifecycle.tile.navigations=Navigazioni
flow.lifecycle.tile.avgNavigation=Navigazione media
flow.lifecycle.tile.rpc=Invocazioni RPC
flow.lifecycle.col.time=Ora
flow.lifecycle.col.event=Evento
flow.lifecycle.col.handler=Gestore / posizione
flow.lifecycle.col.outcome=Esito
flow.lifecycle.col.duration=Durata
flow.lifecycle.dashboard.heading=La tua sessione, in tempo reale
flow.lifecycle.dashboard.desc=Un VaadinServiceInitListener registra gli eventi di ogni sessione fin dall'avvio, quindi questa dashboard mostra anche le navigazioni che hanno lasciato questa pagina. La prima richiesta di un caricamento di pagina inizia prima che esista una sessione, perciò viene conteggiata quando termina ma non quando inizia.
flow.lifecycle.nav.step=Naviga con ?step=n
flow.lifecycle.nav.broken=Naviga verso una route che fallisce
flow.lifecycle.nav.home=Vai alla Home (torna con Indietro)
flow.lifecycle.playground.heading=Generare alcune navigazioni
flow.lifecycle.playground.desc=Ogni tipo di esito: completata, fallita (viene mostrata la vista di errore) e posticipata quando la casella è attiva. Torna su questa pagina dopo averla lasciata per vedere gli eventi avvenuti nel frattempo.
flow.lifecycle.browser.heading=Round trip, misurati nel browser
flow.lifecycle.browser.desc=window.Vaadin.Flow.clients[appId].events genera vaadin-request e vaadin-server-message. Lo script è una @JsDefinition e scrive direttamente nella pagina: segnalare ogni round trip al server causerebbe un altro round trip.
flow.lifecycle.postponed.notification=Navigazione posticipata. Cerca l'esito 'postponed'.
flow.menus.lead=MenuConfiguration.getMenuEntriesTree() restituisce il menu come albero invece che come elenco piatto. La navigazione laterale di questa app è costruita a partire da esso: ogni pagina indica la propria area con @Menu(parent = ...).
flow.menus.tree.summary={0} voci di menu in getMenuEntries(), {1} radici in getMenuEntriesTree().
flow.menus.tree.heading=L'albero dei menu di questa app
flow.menus.tree.desc=Questo è ciò che getMenuEntriesTree() restituisce in questo momento. Il drawer a sinistra visualizza lo stesso albero in modo ricorsivo in SideNavItem, così una nuova pagina compare da sola nel gruppo giusto.
flow.menus.parent.count={0} pagine sono annidate sotto {1}.
flow.menus.parent.missing=Area Security non trovata.
flow.menus.parent.heading=Annidamento con @Menu(parent)
flow.menus.parent.desc=Le pagine qui hanno URL piatti come /strict-csp, quindi la gerarchia delle route le metterebbe tutte al livello superiore. @Menu(parent = ...) le sposta sotto la loro area solo nel menu: URL, navigazione e l'elenco piatto getMenuEntries() restano invariati. Senza, le voci si annidano per @RouteParent o per prefisso dell'URL.
flow.smallwins.lead=Piccole aggiunte che eliminano codice boilerplate che probabilmente hai già scritto tu stesso.
flow.smallwins.birthDate.label=Data di nascita (aaaa-mm-gg)
flow.smallwins.birthDate.error=Usa il formato 2026-11-20
flow.smallwins.converter.heading=Convertitori null-safe in Binder
flow.smallwins.converter.desc=Digita una data, poi svuota il campo. Il campo vuoto diventa null nel bean invece di un errore di parsing, e un valore null nel bean svuota il campo. Le funzioni non vedono mai null né la stringa vuota.
flow.smallwins.ancestor.button=In quale sezione mi trovo?
flow.smallwins.ancestor.found=Antenato più vicino con data-area: {0} (un {1})
flow.smallwins.ancestor.none=Nessun antenato di questo tipo
flow.smallwins.ancestor.outer=Pannello esterno
flow.smallwins.ancestor.desc=findAncestor(Class) cerca per tipo. Il nuovo overload accetta qualsiasi predicato e risale la catena dei genitori.
flow.smallwins.tz.text=Fuso del browser: {0} · ora del browser: {1} · fuso del server: {2}
flow.smallwins.tz.heading=Il fuso orario del browser come ZoneId
flow.smallwins.tz.desc=ExtendedClientDetails ora fornisce un ZoneId e la data e ora locali del browser, pronti per java.time.
flow.smallwins.url.anchor=Aprilo
flow.smallwins.url.desc=Costruire un link a una route, query string inclusa, senza concatenare stringhe a mano.
flow.styling.lead=Caricare un foglio di stile in un livello della cascata CSS, così i tuoi stili hanno sempre la precedenza, e caricare un modulo ES a runtime senza includerlo nel bundle.
flow.styling.layer.styled=Stilizzato solo dal livello: ambra, come dice il livello.
flow.styling.layer.conflict=Il livello dice rosso con il selettore #layer-demo div.layer-box.app-styled.app-styled. L'app dice verde con .layer-box.app-styled. Vince il verde.
flow.styling.layer.heading=Livelli della cascata: valori predefiniti sempre sovrascrivibili
flow.styling.layer.desc=Le regole in un livello hanno priorità inferiore a quelle fuori da qualsiasi livello, indipendentemente dalla specificità. Ideale per un tema o per l'aspetto predefinito di un add-on: gli stili dell'app lo sovrascrivono senza una guerra di specificità.
flow.styling.module.heading=Moduli ES a runtime
flow.styling.module.desc=L'orologio è un elemento personalizzato da js/tour-clock.js, un semplice modulo ES servito come risorsa statica. type = MODULE lo carica a runtime come <script type="module">, quindi non passa da Vite. Usa @JsModule per i file che devono essere inclusi nel bundle.
