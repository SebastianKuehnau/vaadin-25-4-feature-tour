# ai
ai.page.powered=Con tecnologia {0} tramite Spring AI. I tuoi prompt vengono inviati a {1}.
ai.page.noLlm=Nessun LLM configurato. Imposta OPENAI_API_KEY (oppure AI_PROVIDER=anthropic e ANTHROPIC_API_KEY) e riavvia l'app per provare questa demo dal vivo.
ai.grid.lead=L'AI Grid non carica più l'intero risultato della query dell'LLM. Pagina in modo lazy tramite il tuo DatabaseProvider, quindi «mostra tutti gli ordini» funziona anche su tabelle grandi.
