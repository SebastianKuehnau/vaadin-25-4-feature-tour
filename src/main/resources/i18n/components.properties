components.pdf.lead=Shows PDF documents inside the application, with page navigation, zoom and a toolbar. Tagged PDFs expose their structure to screen readers.
components.pdf.note=Preview: enabled with com.vaadin.experimental.pdfViewerComponent=true in src/main/resources/vaadin-featureflags.properties. A Vaadin license is needed (a trial works).
