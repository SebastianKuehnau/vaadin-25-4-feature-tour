home.title=What's new in Vaadin 25.4
home.lead=A hands-on tour of the release: security, framework APIs, components, AI and tooling. Every page is a live demo with the Java code behind it.
area.security.lead=Run under a strict Content Security Policy, with JavaScript declared in Java instead of sent as strings.
area.flow.lead=New HTML components, downloads from any component, hierarchical menus, lifecycle events and smaller API improvements.
area.components.lead=The PDF Viewer preview, labels aside, select all, text selection and more improvements to existing components.
area.ai.lead=Paging for the AI Grid and a smarter Message Input.
area.tooling.lead=What's new in Copilot, and the changes under the hood that don't need a demo.
