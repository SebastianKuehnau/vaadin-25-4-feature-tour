# flow
summary.DownloadsView=Download.onClick() em qualquer componente, novas abas, downloads a partir de Button e itens de menu.
summary.LifecycleView=Eventos de início e fim de requisições e navegações, além de eventos de ida e volta no cliente.
summary.MediaView=Video, Audio e Source a partir de um DownloadHandler com busca na mídia, e NativeForm.
summary.MenusView=@Menu(parent) e getMenuEntriesTree() montam a navegação lateral deste aplicativo.
summary.SmallWinsView=Conversores seguros contra null, findAncestor(predicate), fuso horário do navegador, URLs com parâmetros de consulta.
summary.StylingView=@StyleSheet(layer) para padrões que podem ser sobrescritos, @JavaScript(type = MODULE) em tempo de execução.
flow.downloads.lead=Iniciar um download, ou abrir conteúdo em uma nova aba, com um clique em qualquer componente. Não é mais preciso envolver um botão em um Anchor: o componente mantém a aparência, o tratamento do teclado e os listeners de clique.
flow.downloads.status.none=Nada foi baixado ainda.
flow.downloads.status.served={0} ✅ Entregue: {1}
flow.downloads.status.failed={0} ❌ Falhou: {1}
flow.downloads.card.title=Relatório da versão
flow.downloads.card.subtitle=features-25-4.csv · clique em qualquer lugar do cartão
flow.downloads.card.heading=Qualquer componente: um Card
flow.downloads.card.desc=O download começa no próprio manipulador de clique do navegador, portanto não há nenhuma ida e volta extra. O conteúdo é criado sob demanda, e whenComplete informa sucesso ou falha no servidor.
flow.downloads.newtab.poster=Abrir o pôster em uma nova aba
flow.downloads.newtab.docs=Abrir a documentação do 25.4
flow.downloads.newtab.heading=Abrir em uma nova aba
flow.downloads.newtab.desc=DownloadTarget.NEW_TAB abre o conteúdo de um handler ou uma URL em uma nova aba. A aba é aberta no manipulador de clique, então os bloqueadores de pop-up a deixam passar, ao contrário de Page.open() após uma ida e volta.
flow.downloads.newtab.note=Beta 2: as notas da versão mencionam OpenInNewTab.onClick(), mas essa classe pública ainda não existe. Download.onClick(component, handler, DownloadTarget.NEW_TAB) faz o mesmo hoje.
flow.downloads.button.label=Exportar CSV
flow.downloads.button.desc=O atalho para o caso mais comum.
flow.downloads.menu.export=Exportar
flow.downloads.menu.csv=Como CSV
flow.downloads.menu.poster=Imagem do pôster
flow.downloads.menu.target=Clique com o botão direito aqui
flow.downloads.menu.report=Baixar relatório
flow.downloads.menu.other=Fazer outra coisa
flow.downloads.menu.regular=Os itens de menu normais continuam funcionando.
flow.downloads.menu.heading=Itens de Context Menu e Menu Bar
flow.downloads.menu.desc=Os itens de menu também podem iniciar downloads, a partir de uma barra de menus ou de um menu de contexto.
flow.media.lead=Novos componentes HTML para os players de mídia e os formulários do próprio navegador. A mídia é servida por um DownloadHandler que responde a requisições HTTP Range, de modo que os players podem avançar e retroceder.
flow.media.rangeLog.empty=As requisições do player aparecem aqui.
flow.media.rangeLog.whole=arquivo inteiro
flow.media.seek=Ir para 0:08
flow.media.video.heading=Vídeo com busca
flow.media.video.desc=Duas fontes, WebM e MP4, ambas servidas do classpath. Arraste a linha do tempo ou avance: o player pede um intervalo de bytes e recebe 206 Partial Content em vez do arquivo inteiro.
flow.media.audio.heading=Áudio
flow.media.audio.desc=A mesma API para áudio: um tom crescente, com uma fonte Ogg e uma MP3 para escolher.
flow.media.form.username=Nome de usuário
flow.media.form.password=Senha
flow.media.form.login=Entrar
flow.media.form.heading=Um formulário de login nativo
flow.media.form.desc=O navegador envia por conta própria um <form> nativo, então os gerenciadores de senhas o reconhecem e oferecem salvar e preencher as credenciais. Aqui a resposta vai para um frame, de modo que esta página continua aberta. Com o Spring Security, envie para a URL de processamento de login dele.
flow.lifecycle.lead=O barramento de eventos do serviço do 25.3 agora também informa o início e o fim de cada requisição e navegação, com resultado, duração e manipulador. No navegador, o mecanismo cliente dispara eventos para cada requisição e mensagem do servidor. O Observability Kit usa os mesmos eventos.
flow.lifecycle.browser.waiting=Navegador: aguardando a primeira requisição…
flow.lifecycle.browser.stats=Navegador: {0} requisições, ida e volta média {1} ms, última {2} · {3} mensagens do servidor (respostas e pushes)
flow.lifecycle.browser.last={0} ms ({1}, tentativa {2})
flow.lifecycle.postpone=Adiar a próxima navegação para fora desta página
flow.lifecycle.tile.requests=Requisições iniciadas / concluídas
flow.lifecycle.tile.avgRequest=Requisição média
flow.lifecycle.tile.navigations=Navegações
flow.lifecycle.tile.avgNavigation=Navegação média
flow.lifecycle.tile.rpc=Invocações RPC
flow.lifecycle.col.time=Hora
flow.lifecycle.col.event=Evento
flow.lifecycle.col.handler=Manipulador / local
flow.lifecycle.col.outcome=Resultado
flow.lifecycle.col.duration=Duração
flow.lifecycle.dashboard.heading=Sua sessão, ao vivo
flow.lifecycle.dashboard.desc=Um VaadinServiceInitListener registra os eventos de cada sessão desde a inicialização, então este painel também mostra navegações que saíram desta página. A primeira requisição de um carregamento de página começa antes de existir uma sessão, por isso é contada quando termina, mas não quando começa.
flow.lifecycle.nav.step=Navegar com ?step=n
flow.lifecycle.nav.broken=Navegar para uma rota que falha
flow.lifecycle.nav.home=Ir para o início (voltar com Voltar)
flow.lifecycle.playground.heading=Gerar algumas navegações
flow.lifecycle.playground.desc=Cada tipo de resultado: concluída, falha (a visualização de erro é exibida) e adiada quando a caixa de seleção está marcada. Volte a esta página depois de sair para ver os eventos ocorridos nesse meio tempo.
flow.lifecycle.browser.heading=Idas e voltas, medidas no navegador
flow.lifecycle.browser.desc=window.Vaadin.Flow.clients[appId].events dispara vaadin-request e vaadin-server-message. O script é uma @JsDefinition e escreve diretamente na página: informar cada ida e volta ao servidor causaria outra ida e volta.
flow.lifecycle.postponed.notification=Navegação adiada. Procure pelo resultado 'postponed'.
flow.menus.lead=MenuConfiguration.getMenuEntriesTree() retorna o menu como uma árvore em vez de uma lista plana. A navegação lateral deste aplicativo é construída a partir dele: cada página indica sua área com @Menu(parent = ...).
flow.menus.tree.summary={0} entradas de menu em getMenuEntries(), {1} raízes em getMenuEntriesTree().
flow.menus.tree.heading=A árvore de menus deste aplicativo
flow.menus.tree.desc=Isto é o que getMenuEntriesTree() retorna agora. A gaveta à esquerda renderiza a mesma árvore recursivamente em SideNavItems, então uma nova página aparece sozinha no grupo certo.
flow.menus.parent.count={0} páginas estão aninhadas em {1}.
flow.menus.parent.missing=Área Security não encontrada.
flow.menus.parent.heading=Aninhamento com @Menu(parent)
flow.menus.parent.desc=As páginas aqui têm URLs planas como /strict-csp, então a hierarquia de rotas as colocaria todas no nível superior. @Menu(parent = ...) as move para sua área apenas no menu: URLs, navegação e a lista plana getMenuEntries() permanecem como estão. Sem ele, as entradas se aninham por @RouteParent ou por prefixo de URL.
flow.smallwins.lead=Pequenas adições que eliminam código repetitivo que você provavelmente já escreveu por conta própria.
flow.smallwins.birthDate.label=Data de nascimento (aaaa-mm-dd)
flow.smallwins.birthDate.error=Use o formato 2026-11-20
flow.smallwins.converter.heading=Conversores seguros contra null no Binder
flow.smallwins.converter.desc=Digite uma data e depois limpe o campo. O campo vazio vira null no bean em vez de um erro de análise, e um valor null no bean esvazia o campo. As funções nunca veem null nem a string vazia.
flow.smallwins.ancestor.button=Em qual seção estou?
flow.smallwins.ancestor.found=Ancestral mais próximo com data-area: {0} (um {1})
flow.smallwins.ancestor.none=Nenhum ancestral desse tipo
flow.smallwins.ancestor.outer=Painel externo
flow.smallwins.ancestor.desc=findAncestor(Class) busca por tipo. A nova sobrecarga aceita qualquer predicado e percorre os pais para cima.
flow.smallwins.tz.text=Fuso do navegador: {0} · hora do navegador: {1} · fuso do servidor: {2}
flow.smallwins.tz.heading=O fuso horário do navegador como ZoneId
flow.smallwins.tz.desc=ExtendedClientDetails agora fornece um ZoneId e a data e hora locais do navegador, prontos para java.time.
flow.smallwins.url.anchor=Abrir
flow.smallwins.url.desc=Criar um link para uma rota, incluindo a query string, sem concatenar strings manualmente.
flow.styling.lead=Carregar uma folha de estilo em uma camada de cascata CSS, para que seus próprios estilos sempre prevaleçam, e carregar um módulo ES em tempo de execução sem empacotá-lo.
flow.styling.layer.styled=Estilizado apenas pela camada: âmbar, como a camada determina.
flow.styling.layer.conflict=A camada diz vermelho com o seletor #layer-demo div.layer-box.app-styled.app-styled. O aplicativo diz verde com .layer-box.app-styled. O verde vence.
flow.styling.layer.heading=Camadas de cascata: padrões que você sempre pode sobrescrever
flow.styling.layer.desc=As regras em uma camada têm prioridade menor que as regras fora de qualquer camada, independentemente da especificidade. Ideal para um tema ou para a aparência padrão de um complemento: os estilos do aplicativo a sobrescrevem sem uma guerra de especificidade.
flow.styling.module.heading=Módulos ES em tempo de execução
flow.styling.module.desc=O relógio é um elemento personalizado de js/tour-clock.js, um módulo ES simples servido como recurso estático. type = MODULE o carrega em tempo de execução como <script type="module">, portanto não passa pelo Vite. Use @JsModule para arquivos que devem ser empacotados.
