components.accessibility.capture.heading=Upload : capture par caméra
components.accessibility.capture.desc=Sur téléphone, le bouton ouvre directement la caméra : ENVIRONMENT pour la caméra arrière, USER pour la caméra avant. Sur ordinateur, il ouvre la boîte de dialogue de fichiers habituelle.
