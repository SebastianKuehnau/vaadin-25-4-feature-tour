components.button.lead=DisableOnClickMode.UNTIL_RESPONSE deaktiviert den Button beim Klick und aktiviert ihn automatisch mit der nächsten Antwort wieder, sobald die Click-Listener durchgelaufen sind. Jeder Listener braucht hier 2 Sekunden.
