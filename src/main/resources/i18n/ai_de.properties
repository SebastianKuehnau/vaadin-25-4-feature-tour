# ai
ai.page.powered=Unterstützt von {0} über Spring AI. Deine Prompts werden an {1} gesendet.
ai.page.noLlm=Kein LLM konfiguriert. Setze OPENAI_API_KEY (oder AI_PROVIDER=anthropic und ANTHROPIC_API_KEY) und starte die App neu, um diese Demo live auszuprobieren.
ai.grid.lead=Das AI Grid lädt nicht mehr das gesamte Ergebnis der LLM-Abfrage. Es blättert lazy über deinen DatabaseProvider, sodass „alle Bestellungen anzeigen“ auch bei großen Tabellen funktioniert.
ai.grid.empty=Frage zum Beispiel: Zeige alle Bestellungen aus 2026, die neuesten zuerst
ai.grid.logHint=Seitenanfragen des Grids erscheinen hier. Scrolle im Grid, um mehr zu laden.
ai.grid.thinking=⏳ Denke nach… (Senden ist währenddessen deaktiviert)
ai.grid.done=✅ Fertig
ai.grid.demo1.heading=Lazy Loading über deinen DatabaseProvider
ai.grid.demo1.desc=Die Verkaufstabelle hat 1.500 Zeilen. Frage nach allen und scrolle: Das Grid fordert beim Provider jeweils eine Seite und die Gesamtanzahl an. Solange das LLM arbeitet, deaktiviert der Orchestrator das Senden.
ai.grid.demo2.heading=Message Input: submitDisabled
ai.grid.demo2.desc=Dieselbe API für deine eigenen Abläufe, ganz ohne LLM. Solange das Senden deaktiviert ist, kann der Benutzer die nächste Nachricht weitertippen, anders als bei setEnabled(false).
ai.grid.busy=Anfrage läuft
summary.AiGridView=Das AI Grid blättert über deinen DatabaseProvider; Message Input blockiert das Senden, solange es beschäftigt ist.
