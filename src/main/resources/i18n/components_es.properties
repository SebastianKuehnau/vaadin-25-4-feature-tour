components.multiselect.inmemory.desc=Abra el desplegable y pulse Select All. Luego borre y escriba «land»: el botón pasa a ser Select Filtered y solo se seleccionan los seis países coincidentes. Los demás conservan su estado.
components.multiselect.lazy.heading=Oculto con datos diferidos
components.multiselect.lazy.desc=El mismo ajuste en un combo box con un data provider diferido: el botón permanece oculto, porque seleccionar todo supondría obtener cada elemento del backend. isSelectAllButtonVisible() sigue devolviendo {0}, ya que informa del ajuste, no de la visibilidad efectiva.
components.nowstable.lead=Switch y Breadcrumbs, introducidos en la 25.3, están listos para producción en la 25.4 y ya no necesitan un feature flag. Esta aplicación no usa ningún flag para ellos: consulte vaadin-featureflags.properties.
