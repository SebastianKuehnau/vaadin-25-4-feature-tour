components.nowstable.desc=Ein Switch und Breadcrumbs im manuellen Modus. Der Pfad im App-Header ist der Router-Modus, aufgebaut aus der Route-Hierarchie.
components.nowstable.link=Die 25.3-Feature-Tour enthält vollständige Seiten zu beiden →
components.pdf.lead=Zeigt PDF-Dokumente innerhalb der Anwendung an, mit Seitennavigation, Zoom und Symbolleiste. Getaggte PDFs machen ihre Struktur für Screenreader zugänglich.
components.pdf.note=Vorschau: aktiviert mit com.vaadin.experimental.pdfViewerComponent=true in src/main/resources/vaadin-featureflags.properties. Eine Vaadin-Lizenz ist erforderlich (eine Testlizenz genügt).
