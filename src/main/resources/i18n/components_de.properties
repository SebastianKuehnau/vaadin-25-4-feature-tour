components.labels.fields.heading=Eine Variante für jedes Feld
components.labels.fields.desc=Textfelder, Combo-Boxen, Picker, Select, Checkbox- und Radiobutton-Gruppen sowie Slider unterstützen sie alle. Schalten Sie den Switch um, um den Vergleich mit Beschriftungen oberhalb zu sehen.
components.labels.form.first=Vorname
components.labels.form.last=Nachname
components.labels.form.email=E-Mail-Adresse
components.labels.form.heading=Textausrichtung der Beschriftungen im Form Layout
components.labels.form.desc=Wenn ein Form Layout seine Beschriftungen seitlich anzeigt, können diese jetzt am Anfang, in der Mitte oder am Ende ausgerichtet werden. Die Ausrichtung am Ende hält kurze Beschriftungen nah an ihren Feldern.
components.multiselect.lead=Eine Schaltfläche „Alle auswählen“ über den Einträgen wählt alle aus oder ab, oder nur diejenigen, die zum eingegebenen Filter passen.
components.multiselect.countries=Länder
components.multiselect.lazy=Länder (Lazy-DataProvider)
components.multiselect.selected={0} ausgewählt
components.multiselect.inmemory.heading=Alle auswählen oder alle gefilterten Einträge
components.multiselect.inmemory.desc=Öffnen Sie das Dropdown und drücken Sie Select All. Leeren Sie dann die Auswahl und geben Sie „land“ ein: Die Schaltfläche wird zu Select Filtered, und nur die sechs passenden Länder werden ausgewählt. Die übrigen behalten ihren Zustand.
components.multiselect.lazy.heading=Bei Lazy-Daten ausgeblendet
components.multiselect.lazy.desc=Dieselbe Einstellung bei einer Combo-Box mit Lazy-DataProvider: Die Schaltfläche bleibt ausgeblendet, weil „Alle auswählen“ bedeuten würde, jeden Eintrag vom Backend abzurufen. isSelectAllButtonVisible() liefert weiterhin {0}, denn es meldet die Einstellung, nicht die tatsächliche Sichtbarkeit.
components.nowstable.lead=Switch und Breadcrumbs, eingeführt in 25.3, sind in 25.4 produktionsreif und benötigen kein Feature-Flag mehr. Diese App verwendet dafür kein Flag: siehe vaadin-featureflags.properties.
