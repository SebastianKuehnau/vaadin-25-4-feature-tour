components.labels.form.desc=Quando um Form Layout exibe seus rótulos ao lado, eles agora podem ser alinhados ao início, ao centro ou ao fim. O alinhamento ao fim mantém rótulos curtos próximos aos seus campos.
components.multiselect.lead=Um botão Selecionar tudo acima dos itens seleciona ou desmarca todos eles, ou apenas aqueles que correspondem ao filtro digitado.
