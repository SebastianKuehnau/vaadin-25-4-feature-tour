components.button.lead=DisableOnClickMode.UNTIL_RESPONSE deshabilita el botón al hacer clic y lo vuelve a habilitar automáticamente con la siguiente respuesta, una vez ejecutados los listeners de clic. Cada listener tarda aquí 2 segundos.
