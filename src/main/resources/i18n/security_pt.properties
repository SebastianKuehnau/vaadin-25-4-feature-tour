# security (pt)
summary.StrictCspView=vaadin.csp=off|warn|strict: encontre e remova o JavaScript enviado como strings.
security.strictcsp.legacy.button=Legacy: executeJs(String)
security.strictcsp.declared.button=Declarado: executeJs(TextJs.class)
security.strictcsp.target.waiting=A aguardar JavaScript…
security.strictcsp.lead=O Flow agora pode funcionar com uma Content-Security-Policy baseada em nonce, sem 'unsafe-eval'. Defina vaadin.csp=warn para encontrar todas as chamadas que enviam JavaScript como string, corrija-as e depois mude para strict.
security.strictcsp.note=Beta 2: o próprio Vaadin ainda envia JavaScript como string em alguns locais, como os filtros de eventos dos listeners de clique duplo e clique simples e os atalhos de teclado. Estes lançam uma exceção no modo strict até serem alterados, por isso experimente strict primeiro numa cópia da sua aplicação e mantenha warn por agora.
security.strictcsp.mode.production=Modo de produção. Reinicie com VAADIN_CSP=off|warn|strict para alternar.
security.strictcsp.mode.development=Modo de desenvolvimento. Reinicie com VAADIN_CSP=off|warn|strict para alternar.
security.strictcsp.table.off.all=Predefinição. Nada é verificado.
security.strictcsp.table.off.prod=Sem cabeçalho.
security.strictcsp.table.warn.all=O JavaScript como string é executado e cada ponto de chamada é registado uma vez com um stack trace até ao seu código.
security.strictcsp.table.warn.prod=Igual ao desenvolvimento. Sem cabeçalho.
security.strictcsp.table.strict.all=O JavaScript como string lança CspViolationException, também no modo de desenvolvimento.
security.strictcsp.table.strict.prod=Também envia um cabeçalho Content-Security-Policy baseado em nonce.
security.strictcsp.table.mode=Modo
security.strictcsp.table.everywhere=Desenvolvimento e produção
security.strictcsp.table.production=Apenas produção
security.strictcsp.mode.heading=O modo atual
security.strictcsp.mode.desc=O modo aplica-se igualmente ao desenvolvimento e à produção. A única diferença é o cabeçalho: no modo de desenvolvimento não é enviado nenhum cabeçalho, porque o servidor de desenvolvimento e as ferramentas de desenvolvimento precisam de eval.
security.strictcsp.legacy.set=Definido por uma string, compilada no navegador
security.strictcsp.legacy.ran=Executado. No modo warn, a primeira chamada a partir desta linha é registada abaixo.
security.strictcsp.legacy.blocked=Bloqueado: {0} (modo strict)
security.strictcsp.declared.set=Definido por JavaScript declarado a partir do bundle
security.strictcsp.declared.ran=Executado. O JavaScript declarado nunca é reportado: nada é compilado no navegador.
security.strictcsp.warnings.none=Ainda não foram capturados avisos.
security.strictcsp.legacy.heading=Uma chamada legacy ao lado da sua substituta declarada
security.strictcsp.legacy.desc=Ambos os botões definem o texto abaixo. O primeiro envia JavaScript como string, o que uma política strict bloqueia. O segundo chama um método de interface cujo JavaScript é incluído no bundle durante o build. Os avisos do logger do reporter de CSP aparecem abaixo à medida que são registados.
summary.DeclaredJsView=@JsDefinition, JavaScriptResult<T> tipado, caminhos de dados de evento e filtros declarados.
security.declaredjs.snippet.label=Texto a copiar
security.declaredjs.copy=Copiar
security.declaredjs.viewport=Ler viewport
security.declaredjs.command.label=Comando
security.declaredjs.lead=Declare JavaScript numa interface Java com @JsDefinition e @JsExpression. É incluído no bundle durante o build, pelo que o navegador nunca compila uma string, e as chamadas devolvem valores tipados.
security.declaredjs.copy.ok=✅ "{0}" copiado (JavaScriptResult<Boolean> = true)
security.declaredjs.copy.denied=⚠️ O navegador negou o acesso à área de transferência (JavaScriptResult<Boolean> = false)
security.declaredjs.viewport.result=📐 {0} × {1} px, idioma {2} (JavaScriptResult<Viewport>, um record Java)
security.declaredjs.demo1.heading=Resultados tipados: copiar para a área de transferência
security.declaredjs.demo1.desc=A promise da Clipboard API é resolvida num Boolean no servidor. Um objeto JavaScript pode igualmente tornar-se um record Java: o valor é convertido com Jackson.
security.declaredjs.command.placeholder=Escreva e prima Enter
security.declaredjs.command.hint=Apenas o Enter chega ao servidor. As outras teclas são filtradas no navegador.
security.declaredjs.demo2.heading=Caminhos de dados de evento e filtros declarados
security.declaredjs.demo2.desc=O filtro é declarado uma só vez e criado com um argumento por listener. O valor do campo viaja com o evento como caminho de propriedade, que o navegador lê sem compilar nada.
security.declaredjs.compare.before=Antes da 25.4 (obsoleto, requer 'unsafe-eval')
security.declaredjs.compare.after=25.4 (seguro para CSP)
security.declaredjs.compare.heading=Antigo vs. novo
security.declaredjs.compare.desc=As variantes com string continuam a funcionar, mas setFilter(String) e addEventData(String) estão obsoletos desde a 25.4, e vaadin.csp=warn reporta cada ponto de chamada que ainda os usa.
