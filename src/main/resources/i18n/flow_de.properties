# flow
summary.DownloadsView=Download.onClick() auf jeder Komponente, neue Tabs, Downloads über Button und Menüeinträge.
summary.LifecycleView=Start- und Ende-Events für Requests und Navigationen sowie clientseitige Round-Trip-Events.
summary.MediaView=Video, Audio und Source aus einem DownloadHandler mit Spulen sowie NativeForm.
summary.MenusView=@Menu(parent) und getMenuEntriesTree() bauen die Seitennavigation dieser App.
summary.SmallWinsView=Null-sichere Converter, findAncestor(predicate), Zeitzone des Browsers, URLs mit Query-Parametern.
summary.StylingView=@StyleSheet(layer) für überschreibbare Standardwerte, @JavaScript(type = MODULE) zur Laufzeit.
flow.downloads.lead=Einen Download starten oder Inhalt in einem neuen Tab öffnen, per Klick auf eine beliebige Komponente. Kein Anchor mehr um einen Button: Die Komponente behält Aussehen, Tastaturbedienung und Click-Listener.
flow.downloads.status.none=Noch nichts heruntergeladen.
flow.downloads.status.served={0} ✅ Ausgeliefert: {1}
flow.downloads.status.failed={0} ❌ Fehlgeschlagen: {1}
flow.downloads.card.title=Release-Bericht
flow.downloads.card.subtitle=features-25-4.csv · irgendwo auf die Karte klicken
flow.downloads.card.heading=Jede Komponente: eine Card
flow.downloads.card.desc=Der Download startet im Click-Handler des Browsers selbst, es gibt also keinen zusätzlichen Round Trip. Der Inhalt wird erst bei Bedarf erzeugt, und whenComplete meldet Erfolg oder Fehler auf dem Server.
flow.downloads.newtab.poster=Poster in neuem Tab öffnen
flow.downloads.newtab.docs=Dokumentation zu 25.4 öffnen
flow.downloads.newtab.heading=In einem neuen Tab öffnen
flow.downloads.newtab.desc=DownloadTarget.NEW_TAB öffnet den Inhalt eines Handlers oder eine URL in einem neuen Tab. Der Tab wird im Click-Handler geöffnet, daher lassen Popup-Blocker ihn durch, anders als Page.open() nach einem Round Trip.
flow.downloads.newtab.note=Beta 2: Die Release Notes erwähnen OpenInNewTab.onClick(), aber eine solche öffentliche Klasse gibt es noch nicht. Download.onClick(component, handler, DownloadTarget.NEW_TAB) leistet heute dasselbe.
flow.downloads.button.label=CSV exportieren
flow.downloads.button.desc=Die Abkürzung für den häufigsten Fall.
flow.downloads.menu.export=Exportieren
flow.downloads.menu.csv=Als CSV
flow.downloads.menu.poster=Poster-Bild
flow.downloads.menu.target=Hier rechtsklicken
flow.downloads.menu.report=Bericht herunterladen
flow.downloads.menu.other=Etwas anderes tun
flow.downloads.menu.regular=Normale Menüeinträge funktionieren weiterhin.
flow.downloads.menu.heading=Einträge in Context Menu und Menu Bar
flow.downloads.menu.desc=Auch Menüeinträge können Downloads starten, in einer Menu Bar oder einem Context Menu.
flow.media.lead=Neue HTML-Komponenten für die eigenen Medienplayer und Formulare des Browsers. Medien werden von einem DownloadHandler ausgeliefert, der HTTP-Range-Requests beantwortet, sodass Player spulen können.
flow.media.rangeLog.empty=Hier erscheinen die Requests des Players.
flow.media.rangeLog.whole=ganze Datei
flow.media.seek=Zu 0:08 springen
flow.media.video.heading=Video mit Spulen
flow.media.video.desc=Zwei Quellen, WebM und MP4, beide aus dem Classpath ausgeliefert. Die Zeitleiste ziehen oder vorspringen: Der Player fordert einen Byte-Bereich an und erhält 206 Partial Content statt der ganzen Datei.
flow.media.audio.heading=Audio
flow.media.audio.desc=Dieselbe API für Audio: ein ansteigender Ton, mit einer Ogg- und einer MP3-Quelle zur Auswahl.
flow.media.form.username=Benutzername
flow.media.form.password=Passwort
flow.media.form.login=Anmelden
flow.media.form.heading=Ein natives Login-Formular
flow.media.form.desc=Der Browser sendet ein natives <form> selbst ab, deshalb erkennen Passwortmanager es und bieten an, die Zugangsdaten zu speichern und auszufüllen. Hier landet die Antwort in einem Frame, damit diese Seite geöffnet bleibt. Mit Spring Security wird stattdessen an dessen Login-Verarbeitungs-URL gesendet.
flow.lifecycle.lead=Der Service-Event-Bus aus 25.3 meldet jetzt auch Beginn und Ende jedes Requests und jeder Navigation, mit Ergebnis, Dauer und Handler. Im Browser löst die Client-Engine Events für jeden Request und jede Servernachricht aus. Observability Kit verwendet dieselben Events.
flow.lifecycle.browser.waiting=Browser: Warten auf den ersten Request …
flow.lifecycle.browser.stats=Browser: {0} Requests, durchschnittlicher Round Trip {1} ms, zuletzt {2} · {3} Servernachrichten (Antworten und Pushes)
flow.lifecycle.browser.last={0} ms ({1}, Versuch {2})
flow.lifecycle.postpone=Die nächste Navigation weg von dieser Seite verschieben
flow.lifecycle.tile.requests=Requests gestartet / beendet
flow.lifecycle.tile.avgRequest=Ø Request
flow.lifecycle.tile.navigations=Navigationen
flow.lifecycle.tile.avgNavigation=Ø Navigation
flow.lifecycle.tile.rpc=RPC-Aufrufe
flow.lifecycle.col.time=Zeit
flow.lifecycle.col.event=Event
flow.lifecycle.col.handler=Handler / Ort
flow.lifecycle.col.outcome=Ergebnis
flow.lifecycle.col.duration=Dauer
flow.lifecycle.dashboard.heading=Ihre Sitzung, live
flow.lifecycle.dashboard.desc=Ein VaadinServiceInitListener zeichnet die Events jeder Sitzung von Anfang an auf, deshalb zeigt dieses Dashboard auch Navigationen, die diese Seite verlassen haben. Der erste Request eines Seitenaufrufs beginnt, bevor es eine Sitzung gibt, und wird daher beim Ende gezählt, aber nicht beim Start.
flow.lifecycle.nav.step=Mit ?step=n navigieren
flow.lifecycle.nav.broken=Zu einer fehlschlagenden Route navigieren
flow.lifecycle.nav.home=Zur Startseite (mit Zurück wiederkommen)
flow.lifecycle.playground.heading=Einige Navigationen erzeugen
flow.lifecycle.playground.desc=Jede Art von Ergebnis: abgeschlossen, fehlgeschlagen (die Fehleransicht wird angezeigt) und verschoben, wenn das Kontrollkästchen aktiv ist. Nach dem Verlassen zu dieser Seite zurückkehren, um die Events zu sehen, die in der Zwischenzeit aufgetreten sind.
flow.lifecycle.browser.heading=Round Trips, im Browser gemessen
flow.lifecycle.browser.desc=window.Vaadin.Flow.clients[appId].events löst vaadin-request und vaadin-server-message aus. Das Skript ist eine @JsDefinition und schreibt direkt in die Seite: Jeden Round Trip an den Server zu melden, würde einen weiteren Round Trip verursachen.
flow.lifecycle.postponed.notification=Navigation verschoben. Nach dem Ergebnis 'postponed' suchen.
flow.menus.lead=MenuConfiguration.getMenuEntriesTree() liefert das Menü als Baum statt als flache Liste. Die Seitennavigation dieser App wird daraus aufgebaut: Jede Seite nennt ihren Bereich mit @Menu(parent = ...).
flow.menus.tree.summary={0} Menüeinträge in getMenuEntries(), {1} Wurzeln in getMenuEntriesTree().
flow.menus.tree.heading=Der Menübaum dieser App
flow.menus.tree.desc=Das liefert getMenuEntriesTree() gerade jetzt. Die Seitenleiste links rendert denselben Baum rekursiv in SideNavItems, sodass eine neue Seite von selbst in der richtigen Gruppe erscheint.
flow.menus.parent.count={0} Seiten sind unter {1} verschachtelt.
flow.menus.parent.missing=Bereich „Security“ nicht gefunden.
flow.menus.parent.heading=Verschachteln mit @Menu(parent)
flow.menus.parent.desc=Die Seiten hier haben flache URLs wie /strict-csp, daher würde die Routenhierarchie sie alle auf die oberste Ebene setzen. @Menu(parent = ...) verschiebt sie nur im Menü unter ihren Bereich: URLs, Navigation und die flache Liste getMenuEntries() bleiben unverändert. Ohne diese Angabe werden Einträge nach @RouteParent oder nach URL-Präfix verschachtelt.
flow.smallwins.lead=Kleine Ergänzungen, die Boilerplate-Code überflüssig machen, den Sie vermutlich selbst schon geschrieben haben.
flow.smallwins.birthDate.label=Geburtsdatum (jjjj-mm-tt)
flow.smallwins.birthDate.error=Das Format 2026-11-20 verwenden
flow.smallwins.converter.heading=Null-sichere Converter im Binder
flow.smallwins.converter.desc=Ein Datum eingeben und das Feld dann leeren. Das leere Feld wird im Bean zu null statt zu einem Parse-Fehler, und ein null-Wert im Bean leert das Feld. Die Funktionen sehen nie null oder den leeren String.
flow.smallwins.ancestor.button=In welchem Bereich bin ich?
flow.smallwins.ancestor.found=Nächster Vorfahr mit data-area: {0} (ein {1})
flow.smallwins.ancestor.none=Kein solcher Vorfahr
flow.smallwins.ancestor.outer=Äußeres Panel
flow.smallwins.ancestor.desc=findAncestor(Class) sucht nach Typ. Die neue Überladung nimmt ein beliebiges Predicate und läuft die Eltern nach oben ab.
flow.smallwins.tz.text=Zone des Browsers: {0} · Zeit des Browsers: {1} · Zone des Servers: {2}
flow.smallwins.tz.heading=Die Zeitzone des Browsers als ZoneId
flow.smallwins.tz.desc=ExtendedClientDetails liefert jetzt eine ZoneId und das lokale Datum mit Uhrzeit des Browsers, bereit für java.time.
flow.smallwins.url.anchor=Öffnen
flow.smallwins.url.desc=Einen Link zu einer Route samt Query-String erzeugen, ohne Strings selbst zu verketten.
flow.styling.lead=Ein Stylesheet in einen CSS-Cascade-Layer laden, sodass die eigenen Styles immer Vorrang haben, und ein ES-Modul zur Laufzeit laden, ohne es zu bündeln.
flow.styling.layer.styled=Nur vom Layer gestaltet: bernsteinfarben, wie der Layer es vorgibt.
flow.styling.layer.conflict=Der Layer sagt Rot mit dem Selektor #layer-demo div.layer-box.app-styled.app-styled. Die App sagt Grün mit .layer-box.app-styled. Grün gewinnt.
flow.styling.layer.heading=Cascade Layers: Standardwerte, die sich immer überschreiben lassen
flow.styling.layer.desc=Regeln in einem Layer haben niedrigere Priorität als Regeln außerhalb jedes Layers, unabhängig von der Spezifität. Ideal für ein Theme oder das Standard-Erscheinungsbild eines Add-ons: App-Styles überschreiben es ohne Spezifitätskrieg.
flow.styling.module.heading=ES-Module zur Laufzeit
flow.styling.module.desc=Die Uhr ist ein Custom Element aus js/tour-clock.js, einem einfachen ES-Modul, das als statische Ressource ausgeliefert wird. type = MODULE lädt es zur Laufzeit als <script type="module">, es läuft also nicht durch Vite. @JsModule dient für Dateien, die gebündelt werden sollen.
