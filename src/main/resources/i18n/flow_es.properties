# flow
summary.DownloadsView=Download.onClick() en cualquier componente, pestañas nuevas, descargas desde Button y elementos de menú.
summary.LifecycleView=Eventos de inicio y fin de peticiones y navegaciones, y eventos de ida y vuelta en el cliente.
summary.MediaView=Video, Audio y Source desde un DownloadHandler con búsqueda, y NativeForm.
summary.MenusView=@Menu(parent) y getMenuEntriesTree() construyen la navegación lateral de esta aplicación.
summary.SmallWinsView=Conversores seguros ante null, findAncestor(predicate), zona horaria del navegador, URL con parámetros de consulta.
summary.StylingView=@StyleSheet(layer) para valores por defecto que se pueden sobrescribir, @JavaScript(type = MODULE) en tiempo de ejecución.
flow.downloads.lead=Iniciar una descarga, o abrir contenido en una pestaña nueva, con un clic en cualquier componente. Ya no hace falta envolver un botón en un Anchor: el componente conserva su aspecto, el manejo del teclado y sus listeners de clic.
flow.downloads.status.none=Todavía no se ha descargado nada.
flow.downloads.status.served={0} ✅ Servido: {1}
flow.downloads.status.failed={0} ❌ Error: {1}
flow.downloads.card.title=Informe de la versión
flow.downloads.card.subtitle=features-25-4.csv · clic en cualquier punto de la tarjeta
flow.downloads.card.heading=Cualquier componente: una Card
flow.downloads.card.desc=La descarga se inicia en el propio manejador de clic del navegador, así que no hay ninguna ida y vuelta adicional. El contenido se crea de forma diferida, y whenComplete informa del éxito o del fallo en el servidor.
flow.downloads.newtab.poster=Abrir el póster en una pestaña nueva
flow.downloads.newtab.docs=Abrir la documentación de 25.4
flow.downloads.newtab.heading=Abrir en una pestaña nueva
flow.downloads.newtab.desc=DownloadTarget.NEW_TAB abre el contenido de un handler o una URL en una pestaña nueva. La pestaña se abre en el manejador de clic, así que los bloqueadores de elementos emergentes la dejan pasar, a diferencia de Page.open() tras una ida y vuelta.
flow.downloads.newtab.note=Beta 2: las notas de la versión mencionan OpenInNewTab.onClick(), pero todavía no existe esa clase pública. Download.onClick(component, handler, DownloadTarget.NEW_TAB) hace lo mismo hoy.
flow.downloads.button.label=Exportar CSV
flow.downloads.button.desc=El atajo para el caso más habitual.
flow.downloads.menu.export=Exportar
flow.downloads.menu.csv=Como CSV
flow.downloads.menu.poster=Imagen del póster
flow.downloads.menu.target=Clic derecho aquí
flow.downloads.menu.report=Descargar informe
flow.downloads.menu.other=Hacer otra cosa
flow.downloads.menu.regular=Los elementos de menú normales siguen funcionando.
flow.downloads.menu.heading=Elementos de Context Menu y Menu Bar
flow.downloads.menu.desc=Los elementos de menú también pueden iniciar descargas, desde una barra de menús o un menú contextual.
flow.media.lead=Nuevos componentes HTML para los reproductores multimedia y los formularios del propio navegador. Los medios se sirven desde un DownloadHandler que responde a peticiones HTTP Range, de modo que los reproductores pueden desplazarse.
flow.media.rangeLog.empty=Aquí aparecen las peticiones del reproductor.
flow.media.rangeLog.whole=archivo completo
flow.media.seek=Saltar a 0:08
flow.media.video.heading=Vídeo con búsqueda
flow.media.video.desc=Dos fuentes, WebM y MP4, ambas servidas desde el classpath. Arrastra la línea de tiempo o salta hacia delante: el reproductor pide un rango de bytes y recibe 206 Partial Content en lugar del archivo completo.
flow.media.audio.heading=Audio
flow.media.audio.desc=La misma API para audio: un tono ascendente, con una fuente Ogg y otra MP3 para elegir.
flow.media.form.username=Nombre de usuario
flow.media.form.password=Contraseña
flow.media.form.login=Iniciar sesión
flow.media.form.heading=Un formulario de inicio de sesión nativo
flow.media.form.desc=El navegador envía por sí mismo un <form> nativo, de modo que los gestores de contraseñas lo reconocen y ofrecen guardar y rellenar las credenciales. Aquí la respuesta va a un marco, así que esta página sigue abierta. Con Spring Security, se envía en su lugar a su URL de procesamiento de inicio de sesión.
flow.lifecycle.lead=El bus de eventos del servicio de 25.3 ahora también informa del inicio y el fin de cada petición y navegación, con resultado, duración y manejador. En el navegador, el motor cliente lanza eventos por cada petición y mensaje del servidor. Observability Kit usa los mismos eventos.
flow.lifecycle.browser.waiting=Navegador: esperando la primera petición…
flow.lifecycle.browser.stats=Navegador: {0} peticiones, ida y vuelta media {1} ms, última {2} · {3} mensajes del servidor (respuestas y pushes)
flow.lifecycle.browser.last={0} ms ({1}, intento {2})
flow.lifecycle.postpone=Posponer la próxima navegación fuera de esta página
flow.lifecycle.tile.requests=Peticiones iniciadas / finalizadas
flow.lifecycle.tile.avgRequest=Petición media
flow.lifecycle.tile.navigations=Navegaciones
flow.lifecycle.tile.avgNavigation=Navegación media
flow.lifecycle.tile.rpc=Invocaciones RPC
flow.lifecycle.col.time=Hora
flow.lifecycle.col.event=Evento
flow.lifecycle.col.handler=Manejador / ubicación
flow.lifecycle.col.outcome=Resultado
flow.lifecycle.col.duration=Duración
flow.lifecycle.dashboard.heading=Tu sesión, en vivo
flow.lifecycle.dashboard.desc=Un VaadinServiceInitListener registra los eventos de cada sesión desde el arranque, así que este panel también muestra las navegaciones que salieron de esta página. La primera petición de una carga de página empieza antes de que exista una sesión, por lo que se cuenta cuando termina pero no cuando empieza.
flow.lifecycle.nav.step=Navegar con ?step=n
flow.lifecycle.nav.broken=Navegar a una ruta que falla
flow.lifecycle.nav.home=Ir al inicio (volver con Atrás)
flow.lifecycle.playground.heading=Generar algunas navegaciones
flow.lifecycle.playground.desc=Cada tipo de resultado: completada, fallida (se muestra la vista de error) y pospuesta cuando la casilla está activada. Vuelve a esta página después de salir para ver los eventos ocurridos mientras tanto.
flow.lifecycle.browser.heading=Idas y vueltas, medidas en el navegador
flow.lifecycle.browser.desc=window.Vaadin.Flow.clients[appId].events lanza vaadin-request y vaadin-server-message. El script es una @JsDefinition y escribe directamente en la página: informar al servidor de cada ida y vuelta provocaría otra ida y vuelta.
flow.lifecycle.postponed.notification=Navegación pospuesta. Busca el resultado 'postponed'.
flow.menus.lead=MenuConfiguration.getMenuEntriesTree() devuelve el menú como un árbol en lugar de una lista plana. La navegación lateral de esta aplicación se construye a partir de él: cada página indica su área con @Menu(parent = ...).
flow.menus.tree.summary={0} entradas de menú en getMenuEntries(), {1} raíces en getMenuEntriesTree().
flow.menus.tree.heading=El árbol de menús de esta aplicación
flow.menus.tree.desc=Esto es lo que devuelve getMenuEntriesTree() ahora mismo. El panel lateral de la izquierda representa el mismo árbol de forma recursiva en SideNavItems, así que una página nueva aparece sola en el grupo correcto.
flow.menus.parent.count={0} páginas están anidadas bajo {1}.
flow.menus.parent.missing=No se encontró el área Security.
flow.menus.parent.heading=Anidación con @Menu(parent)
flow.menus.parent.desc=Las páginas de aquí tienen URL planas como /strict-csp, así que la jerarquía de rutas las pondría todas en el nivel superior. @Menu(parent = ...) las mueve bajo su área solo en el menú: las URL, la navegación y la lista plana getMenuEntries() se mantienen igual. Sin él, las entradas se anidan por @RouteParent o por prefijo de URL.
flow.smallwins.lead=Pequeñas incorporaciones que eliminan código repetitivo que probablemente ya has escrito tú mismo.
flow.smallwins.birthDate.label=Fecha de nacimiento (aaaa-mm-dd)
flow.smallwins.birthDate.error=Usa el formato 2026-11-20
flow.smallwins.converter.heading=Conversores seguros ante null en Binder
flow.smallwins.converter.desc=Escribe una fecha y luego vacía el campo. El campo vacío pasa a ser null en el bean en lugar de un error de análisis, y un valor null en el bean vacía el campo. Las funciones nunca ven null ni la cadena vacía.
flow.smallwins.ancestor.button=¿En qué sección estoy?
flow.smallwins.ancestor.found=Ancestro más cercano con data-area: {0} (un {1})
flow.smallwins.ancestor.none=No hay tal ancestro
flow.smallwins.ancestor.outer=Panel exterior
flow.smallwins.ancestor.desc=findAncestor(Class) busca por tipo. La nueva sobrecarga acepta cualquier predicado y recorre los padres hacia arriba.
flow.smallwins.tz.text=Zona del navegador: {0} · hora del navegador: {1} · zona del servidor: {2}
flow.smallwins.tz.heading=La zona horaria del navegador como ZoneId
flow.smallwins.tz.desc=ExtendedClientDetails ahora te da un ZoneId y la fecha y hora locales del navegador, listos para java.time.
flow.smallwins.url.anchor=Abrirlo
flow.smallwins.url.desc=Crear un enlace a una ruta, con su cadena de consulta, sin concatenar cadenas tú mismo.
flow.styling.lead=Cargar una hoja de estilos en una capa de cascada CSS, para que tus propios estilos siempre se impongan, y cargar un módulo ES en tiempo de ejecución sin empaquetarlo.
flow.styling.layer.styled=Con el estilo solo de la capa: ámbar, como dice la capa.
flow.styling.layer.conflict=La capa dice rojo con el selector #layer-demo div.layer-box.app-styled.app-styled. La aplicación dice verde con .layer-box.app-styled. Gana el verde.
flow.styling.layer.heading=Capas de cascada: valores por defecto que siempre puedes sobrescribir
flow.styling.layer.desc=Las reglas de una capa tienen menor prioridad que las que están fuera de cualquier capa, sin importar la especificidad. Ideal para un tema o el aspecto por defecto de un complemento: los estilos de la aplicación lo sobrescriben sin una guerra de especificidad.
flow.styling.module.heading=Módulos ES en tiempo de ejecución
flow.styling.module.desc=El reloj es un elemento personalizado de js/tour-clock.js, un módulo ES sencillo servido como recurso estático. type = MODULE lo carga en tiempo de ejecución como <script type="module">, así que no pasa por Vite. Usa @JsModule para los archivos que deban empaquetarse.
