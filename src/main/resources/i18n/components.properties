components.labels.form.desc=When a Form Layout shows its labels aside, the labels can now be aligned to the start, center or end. End alignment keeps short labels close to their fields.
components.multiselect.lead=A Select all button above the items selects or deselects all of them, or only the ones that match the filter you typed.
