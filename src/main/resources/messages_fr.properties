home.title=Nouveautés de Vaadin 25.4
home.lead=Une visite guidée de la version : sécurité, API du framework, composants, IA et outillage. Chaque page est une démo en direct avec le code Java correspondant.
area.security.lead=Exécution sous une Content Security Policy stricte, avec du JavaScript déclaré en Java plutôt qu'envoyé sous forme de chaînes.
area.flow.lead=Nouveaux composants HTML, téléchargements depuis n'importe quel composant, menus hiérarchiques, événements de cycle de vie et petites améliorations d'API.
area.components.lead=L'aperçu du PDF Viewer, libellés à côté, tout sélectionner, sélection de texte et d'autres améliorations des composants existants.
area.ai.lead=Pagination pour l'AI Grid et un Message Input plus intelligent.
area.tooling.lead=Les nouveautés de Copilot et les changements en coulisses qui ne nécessitent pas de démo.
