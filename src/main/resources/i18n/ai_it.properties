ai.grid.demo1.heading=Caricamento lazy tramite il tuo DatabaseProvider
ai.grid.demo1.desc=La tabella delle vendite ha 1.500 righe. Chiedile tutte e scorri: la griglia chiede al provider una pagina alla volta e il conteggio totale. Mentre l'LLM lavora, l'orchestratore disabilita l'invio.
ai.grid.demo2.heading=Message Input: submitDisabled
ai.grid.demo2.desc=La stessa API per i tuoi flussi, senza bisogno di un LLM. Mentre l'invio è disabilitato, l'utente può continuare a scrivere il messaggio successivo, a differenza di setEnabled(false).
