components.button.saves.one={0} save
components.button.saves.other={0} saves
components.button.disabledUntil={0} · stays disabled until setEnabled(true)
components.button.col1.title=Before: no protection
components.button.col1.text=Double-click: both clicks are queued, so you save twice.
components.button.col2.title=Before: setDisableOnClick(true)
components.button.col2.text=Safe, but you must enable the button yourself, also on errors.
components.button.col3.title=25.4: UNTIL_RESPONSE
components.button.col3.text=Disabled while the server works, enabled again by the response.
components.button.heading=Double-click each button
components.button.desc=All three listeners sleep for 2 seconds to simulate a slow save.
