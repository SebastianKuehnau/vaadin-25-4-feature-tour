components.multiselect.lazy.desc=La stessa impostazione su una combo box con un data provider lazy: il pulsante resta nascosto, perché selezionare tutto significherebbe recuperare ogni elemento dal backend. isSelectAllButtonVisible() restituisce ancora {0}: riporta l''impostazione, non la visibilità effettiva.
components.nowstable.lead=Switch e Breadcrumbs, introdotti nella 25.3, sono pronti per la produzione nella 25.4 e non richiedono più un feature flag. Questa app non usa alcun flag per essi: vedi vaadin-featureflags.properties.
