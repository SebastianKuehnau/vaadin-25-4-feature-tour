# flow
summary.DownloadsView=Download.onClick() on any component, new tabs, Button and menu item downloads.
summary.LifecycleView=Request and navigation start/end events, plus client-side round-trip events.
summary.MediaView=Video, Audio and Source from a DownloadHandler with seeking, and NativeForm.
summary.MenusView=@Menu(parent) and getMenuEntriesTree() build this app's own side nav.
summary.SmallWinsView=Null-safe converters, findAncestor(predicate), browser time zone, URLs with query parameters.
summary.StylingView=@StyleSheet(layer) for overridable defaults, @JavaScript(type = MODULE) at runtime.
flow.downloads.lead=Start a download, or open content in a new tab, from a click on any component. No Anchor around a button anymore: the component keeps its look, keyboard handling and click listeners.
flow.downloads.status.none=Nothing downloaded yet.
flow.downloads.status.served={0} ✅ Served {1}
flow.downloads.status.failed={0} ❌ Failed {1}
flow.downloads.card.title=Release report
flow.downloads.card.subtitle=features-25-4.csv · click anywhere on the card
flow.downloads.card.heading=Any component: a Card
flow.downloads.card.desc=The download starts in the browser's own click handler, so there is no extra round trip. The content is created lazily, and whenComplete reports success or failure on the server.
flow.downloads.newtab.poster=Open poster in a new tab
flow.downloads.newtab.docs=Open the 25.4 docs
flow.downloads.newtab.heading=Open in a new tab
flow.downloads.newtab.desc=DownloadTarget.NEW_TAB opens handler content or a URL in a new tab. The tab opens in the click handler, so popup blockers let it through, unlike Page.open() after a round trip.
flow.downloads.newtab.note=Beta 2: the release notes mention OpenInNewTab.onClick(), but there is no such public class yet. Download.onClick(component, handler, DownloadTarget.NEW_TAB) does the same today.
flow.downloads.button.label=Export CSV
flow.downloads.button.desc=The shortcut for the most common case.
flow.downloads.menu.export=Export
flow.downloads.menu.csv=As CSV
flow.downloads.menu.poster=Poster image
flow.downloads.menu.target=Right-click here
flow.downloads.menu.report=Download report
flow.downloads.menu.other=Do something else
flow.downloads.menu.regular=Regular menu items still work.
flow.downloads.menu.heading=Context Menu and Menu Bar items
flow.downloads.menu.desc=Menu items can start downloads too, from a menu bar or a context menu.
flow.media.lead=New HTML components for the browser's own media players and forms. Media is served from a DownloadHandler that answers HTTP range requests, so players can seek.
flow.media.rangeLog.empty=Requests from the player appear here.
flow.media.rangeLog.whole=whole file
flow.media.seek=Jump to 0:08
flow.media.video.heading=Video with seeking
flow.media.video.desc=Two sources, WebM and MP4, both served from the classpath. Drag the timeline or jump ahead: the player asks for a byte range and gets 206 Partial Content instead of the whole file.
flow.media.audio.heading=Audio
flow.media.audio.desc=The same API for audio: a rising tone, with an Ogg and an MP3 source to pick from.
flow.media.form.username=Username
flow.media.form.password=Password
flow.media.form.login=Log in
flow.media.form.heading=A native login form
flow.media.form.desc=The browser submits a native <form> by itself, so password managers recognize it and offer to save and fill the credentials. Here the response goes into a frame, so this page stays open. With Spring Security, post to its login processing URL instead.
flow.lifecycle.lead=The service event bus from 25.3 now also reports the start and end of every request and navigation, with outcome, duration and handler. In the browser, the client engine fires events for each request and server message. Observability Kit uses the same events.
flow.lifecycle.browser.waiting=Browser: waiting for the first request…
flow.lifecycle.browser.stats=Browser: {0} requests, avg round trip {1} ms, last {2} · {3} server messages (replies and pushes)
flow.lifecycle.browser.last={0} ms ({1}, attempt {2})
flow.lifecycle.postpone=Postpone the next navigation away from this page
flow.lifecycle.tile.requests=Requests started / ended
flow.lifecycle.tile.avgRequest=Avg. request
flow.lifecycle.tile.navigations=Navigations
flow.lifecycle.tile.avgNavigation=Avg. navigation
flow.lifecycle.tile.rpc=RPC invocations
flow.lifecycle.col.time=Time
flow.lifecycle.col.event=Event
flow.lifecycle.col.handler=Handler / location
flow.lifecycle.col.outcome=Outcome
flow.lifecycle.col.duration=Duration
flow.lifecycle.dashboard.heading=Your session, live
flow.lifecycle.dashboard.desc=A VaadinServiceInitListener records the events of every session from startup, so this dashboard also shows navigations that left this page. The first request of a page load starts before there is a session, so it is counted when it ends but not when it starts.
flow.lifecycle.nav.step=Navigate with ?step=n
flow.lifecycle.nav.broken=Navigate to a failing route
flow.lifecycle.nav.home=Go to Home (come back with Back)
flow.lifecycle.playground.heading=Generate some navigations
flow.lifecycle.playground.desc=Each kind of outcome: completed, failed (the error view is shown), and postponed when the checkbox is on. Come back to this page after leaving it to see the events that happened meanwhile.
flow.lifecycle.browser.heading=Round trips, measured in the browser
flow.lifecycle.browser.desc=window.Vaadin.Flow.clients[appId].events fires vaadin-request and vaadin-server-message. The script is a @JsDefinition, and it writes into the page directly: reporting each round trip to the server would cause another round trip.
flow.lifecycle.postponed.notification=Navigation postponed. Look for the 'postponed' outcome.
flow.menus.lead=MenuConfiguration.getMenuEntriesTree() returns the menu as a tree instead of a flat list. The side nav of this app is built from it: every page names its area with @Menu(parent = ...).
flow.menus.tree.summary={0} menu entries in getMenuEntries(), {1} roots in getMenuEntriesTree().
flow.menus.tree.heading=The menu tree of this app
flow.menus.tree.desc=This is what getMenuEntriesTree() returns right now. The drawer on the left renders the same tree recursively into SideNavItems, so a new page shows up in the right group by itself.
flow.menus.parent.count={0} pages are nested under {1}.
flow.menus.parent.missing=Security area not found.
flow.menus.parent.heading=Nesting with @Menu(parent)
flow.menus.parent.desc=The pages here have flat URLs such as /strict-csp, so the route hierarchy would put them all at the top level. @Menu(parent = ...) moves them under their area in the menu only: URLs, navigation and the flat getMenuEntries() list stay as they are. Without it, entries nest by @RouteParent or by URL prefix.
flow.smallwins.lead=Small additions that remove boilerplate you have probably written yourself.
flow.smallwins.birthDate.label=Birth date (yyyy-mm-dd)
flow.smallwins.birthDate.error=Use the format 2026-11-20
flow.smallwins.converter.heading=Null-safe converters in Binder
flow.smallwins.converter.desc=Type a date, then clear the field. The empty field becomes null in the bean instead of a parse error, and a null bean value empties the field. The functions never see null or the empty string.
flow.smallwins.ancestor.button=Which section am I in?
flow.smallwins.ancestor.found=Nearest ancestor with data-area: {0} (a {1})
flow.smallwins.ancestor.none=No such ancestor
flow.smallwins.ancestor.outer=Outer panel
flow.smallwins.ancestor.desc=findAncestor(Class) finds by type. The new overload takes any predicate and walks up the parents.
flow.smallwins.tz.text=Browser zone: {0} · browser time: {1} · server zone: {2}
flow.smallwins.tz.heading=The browser's time zone as a ZoneId
flow.smallwins.tz.desc=ExtendedClientDetails now gives you a ZoneId and the browser's local date-time, ready for java.time.
flow.smallwins.url.anchor=Open it
flow.smallwins.url.desc=Build a link to a route including its query string, without concatenating strings yourself.
flow.styling.lead=Load a style sheet into a CSS cascade layer, so your own styles always win over it, and load an ES module at runtime without bundling it.
flow.styling.layer.styled=Styled only by the layer: amber, as the layer says.
flow.styling.layer.conflict=The layer says red with selector #layer-demo div.layer-box.app-styled.app-styled. The app says green with .layer-box.app-styled. Green wins.
flow.styling.layer.heading=Cascade layers: defaults you can always override
flow.styling.layer.desc=Rules in a layer have lower priority than rules outside of any layer, regardless of specificity. Ideal for a theme or an add-on's default look: app styles override it without a specificity war.
flow.styling.module.heading=Runtime ES modules
flow.styling.module.desc=The clock is a custom element from js/tour-clock.js, a plain ES module served as a static resource. type = MODULE loads it as <script type="module"> at runtime, so it does not go through Vite. Use @JsModule for files that should be bundled.
