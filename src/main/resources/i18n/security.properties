# security
summary.StrictCspView=vaadin.csp=off|warn|strict: find and remove JavaScript sent as strings.
security.strictcsp.legacy.button=Legacy: executeJs(String)
security.strictcsp.declared.button=Declared: executeJs(TextJs.class)
security.strictcsp.target.waiting=Waiting for JavaScript…
security.strictcsp.lead=Flow can now run under a nonce-based Content-Security-Policy without 'unsafe-eval'. Set vaadin.csp=warn to find every call that sends JavaScript as a string, fix them, then switch to strict.
security.strictcsp.note=Beta 2: Vaadin itself still sends string JavaScript in a few places, such as the event filters of double and single click listeners and keyboard shortcuts. Those throw in strict mode until they are changed, so try strict on a copy of your app first and keep warn for now.
security.strictcsp.mode.production=Production mode. Restart with VAADIN_CSP=off|warn|strict to switch.
security.strictcsp.mode.development=Development mode. Restart with VAADIN_CSP=off|warn|strict to switch.
security.strictcsp.table.off.all=Default. Nothing is checked.
security.strictcsp.table.off.prod=No header.
security.strictcsp.table.warn.all=String JavaScript runs, and each call site is logged once with a stack trace to your code.
security.strictcsp.table.warn.prod=Same as dev. No header.
security.strictcsp.table.strict.all=String JavaScript throws CspViolationException, in dev mode too.
security.strictcsp.table.strict.prod=Also sends a nonce-based Content-Security-Policy header.
security.strictcsp.table.mode=Mode
security.strictcsp.table.everywhere=Development and production
security.strictcsp.table.production=Production only
security.strictcsp.mode.heading=The current mode
security.strictcsp.mode.desc=The mode applies to development and production alike. The only difference is the header: in development mode no header is sent, because the dev server and dev tools need eval.
security.strictcsp.legacy.set=Set by a string, compiled in the browser
security.strictcsp.legacy.ran=Ran. In warn mode the first call from this line is logged below.
security.strictcsp.legacy.blocked=Blocked: {0} (strict mode)
security.strictcsp.declared.set=Set by declared JavaScript from the bundle
security.strictcsp.declared.ran=Ran. Declared JavaScript is never reported: nothing is compiled in the browser.
security.strictcsp.warnings.none=No warnings captured yet.
security.strictcsp.legacy.heading=A legacy call next to its declared replacement
security.strictcsp.legacy.desc=Both buttons set the text below. The first sends JavaScript as a string, which a strict policy blocks. The second calls an interface method whose JavaScript is collected into the bundle at build time. Warnings from the CSP reporter's logger appear below as they are logged.
summary.DeclaredJsView=@JsDefinition, typed JavaScriptResult<T>, event data paths and declared filters.
security.declaredjs.snippet.label=Text to copy
security.declaredjs.copy=Copy
security.declaredjs.viewport=Read viewport
security.declaredjs.command.label=Command
security.declaredjs.lead=Declare JavaScript in a Java interface with @JsDefinition and @JsExpression. It is collected into the bundle at build time, so the browser never compiles a string, and calls return typed values.
security.declaredjs.copy.ok=✅ Copied "{0}" (JavaScriptResult<Boolean> = true)
security.declaredjs.copy.denied=⚠️ The browser denied clipboard access (JavaScriptResult<Boolean> = false)
security.declaredjs.viewport.result=📐 {0} × {1} px, language {2} (JavaScriptResult<Viewport>, a Java record)
security.declaredjs.demo1.heading=Typed results: copy to clipboard
security.declaredjs.demo1.desc=The promise from the Clipboard API resolves to a Boolean on the server. A JavaScript object can just as well become a Java record: the value is converted with Jackson.
security.declaredjs.command.placeholder=Type and press Enter
security.declaredjs.command.hint=Only Enter reaches the server. Other keys are filtered in the browser.
security.declaredjs.demo2.heading=Event data paths and declared filters
security.declaredjs.demo2.desc=The filter is declared once and created with an argument per listener. The value of the field travels with the event as a property path, which the browser reads without compiling anything.
security.declaredjs.compare.before=Before 25.4 (deprecated, needs 'unsafe-eval')
security.declaredjs.compare.after=25.4 (CSP-safe)
security.declaredjs.compare.heading=Old vs. new
security.declaredjs.compare.desc=The string variants still work, but setFilter(String) and addEventData(String) are deprecated since 25.4, and vaadin.csp=warn reports every call site that still uses them.
