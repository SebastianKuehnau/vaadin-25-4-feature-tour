# tooling
tooling.copilot.lead=Aqui não há demo ao vivo: o Copilot é a demo. Esta aplicação roda em modo de desenvolvimento, então abra o Copilot com o botão no canto inferior direito e experimente estes recursos nas páginas deste tour.
tooling.copilot.card1.title=Testes Browserless a partir do gravador de testes de UI
tooling.copilot.card1.text=O gravador agora escreve testes Browserless além de testes TestBench e registra se os componentes estão habilitados ou desabilitados.
tooling.copilot.card1.step1=Abra o Copilot, vá para Features e habilite o gravador de testes de UI (um plugin experimental).
tooling.copilot.card1.step2=Inicie a gravação e depois use uma página: experimente a página Button e clique em Save (UNTIL_RESPONSE).
tooling.copilot.card1.step3=Pare a gravação e escolha Browserless como saída.
tooling.copilot.card1.step4=Copie o teste para src/test/java e execute ./mvnw test.
tooling.copilot.card2.title=Views em Kotlin
tooling.copilot.card2.text=O Copilot edita views em Kotlin além de Java: os controles de alinhamento, espaçamento, padding e tamanho, a adição de componentes e templates e o editor de temas geram Kotlin idiomático, incluindo trailing lambdas e chamadas seguras.
tooling.copilot.card2.step1=Experimente em um projeto Kotlin: este tour é somente Java.
tooling.copilot.card3.title=Form Layout auto-responsive
tooling.copilot.card3.text=O Copilot escolhe a API certa para o FormLayout auto-responsive, sem chamadas desnecessárias a addFormRow.
tooling.copilot.card3.step1=Abra Forms: Labels Aside.
tooling.copilot.card3.step2=Selecione o Form Layout na parte inferior e altere suas colunas ou rótulos no Copilot.
tooling.copilot.card4.title=Component Gallery
tooling.copilot.card4.text=A view All Components agora é a Component Gallery. Ela segue o tema da sua aplicação, é mais fácil de navegar e importa todos os seus componentes personalizados para a biblioteca de UI de uma só vez.
tooling.copilot.card4.step1=Abra o Copilot e arraste um componente da Component Gallery para qualquer página.
tooling.copilot.card5.title=Drilldown com CMD/CTRL
tooling.copilot.card5.text=Mantenha CMD (macOS) ou CTRL pressionado ao passar o mouse para aprofundar e selecionar componentes aninhados. O Copilot também lida com componentes que o seu código adiciona implicitamente.
tooling.copilot.card5.step1=Na página Grid, mantenha CMD/CTRL pressionado e passe o mouse sobre o grid para alcançar uma única coluna.
tooling.copilot.card6.title=Atualizações otimistas (experimental)
tooling.copilot.card6.text=As alterações aparecem imediatamente, antes de o servidor confirmá-las. Habilite entre os recursos experimentais do Copilot.
tooling.copilot.card6.step1=Habilite as atualizações otimistas em Features.
tooling.copilot.card6.step2=Altere o texto de um botão na página Button e veja-o atualizar instantaneamente.
tooling.copilot.card7.title=Novo onboarding e novo login
tooling.copilot.card7.text=Um fluxo de onboarding redesenhado e uma nova caixa de diálogo de login permitem entrar pelo verificador de licença, e um indicador no menu mostra quando uma nova versão tem notas de lançamento. CMD + Enter salva os comentários.
tooling.hood.lead=Mudanças que não precisam de demo, mas importam ao atualizar.
tooling.hood.card1.title=Spring Boot 4.2 e Node.js 26
tooling.hood.card1.text=O Spring Boot 4.2 é a versão suportada deste minor. O Node.js 26 é o mínimo: se o seu Node.js global for mais antigo, o Vaadin baixa o Node.js 26 para ~/.vaadin. Foi isso que aconteceu quando esta aplicação construiu pela primeira vez o seu dev bundle.
tooling.hood.card2.title=vaadin-spring mais enxuto
tooling.hood.card2.text=O vaadin-spring não traz mais Spring MVC, Spring WebSocket nem Hibernate Validator. O starter do Spring Boot adiciona os starters de websocket e validação, então aplicações Boot como esta continuam funcionando. Aplicações Spring puras os declaram por conta própria.
tooling.hood.card3.title=Hilla: TypeScript gerado em Java
tooling.hood.card3.text=O TypeScript de endpoints e modelos é gerado pelo Java na mesma execução que varre suas classes, sem processo Node.js. O TypeScriptProcessor permite que as ferramentas de build o executem. Removidos: a configuração do plugin gerador, nodeCommand e hilla-openapi.json. Os modelos de formulário agora são constantes de @vaadin/hilla-models.
tooling.hood.card4.title=CDI e Quarkus na versão do Flow
tooling.hood.card4.text=O add-on CDI e a extensão Quarkus são desenvolvidos no repositório do Flow e versionados como 25.4.x. Os group e artifact IDs não mudam.
tooling.hood.card5.title=Observability Kit sobre eventos de ciclo de vida
tooling.hood.card5.text=As métricas de navegação, requisições e locks de sessão são medidas a partir dos novos eventos de ciclo de vida do Flow, e a medição das interações do navegador funciona em produção e com push via WebSocket. Veja a página Lifecycle Events para os eventos em si.
tooling.hood.card6.title=Mudanças incompatíveis
tooling.hood.card6.text=Verifique estes pontos ao atualizar:
tooling.hood.card6.step1=A propriedade i18n dos web components é undefined até você defini-la.
tooling.hood.card6.step2=Um título de Card em um slot agora tem prioridade sobre cardTitle.
tooling.hood.card6.step3=As células do calendário do Date Picker e as células do corpo do Grid têm um novo DOM: verifique CSS personalizado e testes.
tooling.hood.card6.step4=Bindings de signals bidirecionais agora exigem um callback de escrita.
tooling.hood.card6.step5=Dados de evento e filtros baseados em strings estão obsoletos (veja Declared JavaScript).
tooling.hood.versions=Esta aplicação roda com Flow {0} sobre Spring Boot {1} e Java {2}.
summary.CopilotView=Views em Kotlin, testes Browserless do gravador, Component Gallery e mais. Um tour guiado.
summary.UnderTheHoodView=TypeScript do Hilla em Java, dependências do Spring mais enxutas, Node.js 26, Spring Boot 4.2, mudanças incompatíveis.
