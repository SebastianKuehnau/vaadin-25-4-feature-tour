components.labels.fields.heading=Une seule variante pour chaque champ
components.labels.fields.desc=Les champs de texte, combo boxes, sélecteurs, Select, groupes de cases à cocher et de boutons radio ainsi que le slider la prennent tous en charge. Basculez le switch pour comparer avec les libellés au-dessus.
components.labels.form.first=Prénom
components.labels.form.last=Nom de famille
components.labels.form.email=Adresse e-mail
components.labels.form.heading=Alignement du texte des libellés dans Form Layout
components.labels.form.desc=Lorsqu'un Form Layout affiche ses libellés sur le côté, ceux-ci peuvent désormais être alignés au début, au centre ou à la fin. L'alignement à la fin garde les libellés courts proches de leurs champs.
components.multiselect.lead=Un bouton Tout sélectionner au-dessus des éléments les sélectionne ou les désélectionne tous, ou seulement ceux qui correspondent au filtre saisi.
components.multiselect.countries=Pays
components.multiselect.lazy=Pays (data provider paresseux)
components.multiselect.selected={0} sélectionné(s)
components.multiselect.inmemory.heading=Tout sélectionner, ou tous les éléments filtrés
components.multiselect.inmemory.desc=Ouvrez la liste déroulante et appuyez sur Select All. Puis effacez et saisissez « land » : le bouton devient Select Filtered, et seuls les six pays correspondants sont sélectionnés. Les autres conservent leur état.
components.multiselect.lazy.heading=Masqué avec des données paresseuses
components.multiselect.lazy.desc=Le même réglage sur une combo box avec un data provider paresseux : le bouton reste masqué, car tout sélectionner reviendrait à récupérer chaque élément depuis le backend. isSelectAllButtonVisible() renvoie toujours {0} : il indique le réglage, pas la visibilité effective.
components.nowstable.lead=Switch et Breadcrumbs, introduits en 25.3, sont prêts pour la production en 25.4 et n'ont plus besoin de feature flag. Cette application n'utilise aucun flag pour eux : voir vaadin-featureflags.properties.
components.nowstable.switch=Notifications par e-mail
components.nowstable.crumb.home=Accueil
components.nowstable.crumb.components=Composants
components.nowstable.crumb.nowstable=Désormais stable
components.nowstable.heading=Aucun flag nécessaire
components.nowstable.desc=Un Switch et des Breadcrumbs en mode manuel. Le fil d'Ariane de l'en-tête de l'application est le mode routeur, construit à partir de la hiérarchie des routes.
components.nowstable.link=La visite des fonctionnalités 25.3 propose des pages complètes pour les deux →
components.pdf.lead=Affiche des documents PDF dans l'application, avec navigation entre les pages, zoom et barre d'outils. Les PDF balisés exposent leur structure aux lecteurs d'écran.
components.pdf.note=Aperçu : activé avec com.vaadin.experimental.pdfViewerComponent=true dans src/main/resources/vaadin-featureflags.properties. Une licence Vaadin est nécessaire (un essai suffit).
components.pdf.url.title=Chargé depuis une URL
components.pdf.url.heading=Depuis une URL
components.pdf.url.desc=Le cas le plus simple : un fichier statique servi par l'application, ou n'importe quelle URL que le navigateur peut récupérer.
components.pdf.handler.title=Servi par un DownloadHandler
components.pdf.bookmark.aria=Ajouter cette page aux favoris
components.pdf.bookmarked=Page {0} ajoutée aux favoris
