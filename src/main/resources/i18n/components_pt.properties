components.multiselect.inmemory.desc=Abra a lista suspensa e pressione Select All. Depois limpe e digite "land": o botão passa a ser Select Filtered e somente os seis países correspondentes são selecionados. Os demais mantêm seu estado.
components.multiselect.lazy.heading=Oculto com dados lazy
components.multiselect.lazy.desc=A mesma configuração em um combo box com data provider lazy: o botão permanece oculto, pois selecionar tudo significaria buscar cada item do backend. isSelectAllButtonVisible() ainda retorna {0}, pois informa a configuração, não a visibilidade efetiva.
components.nowstable.lead=Switch e Breadcrumbs, introduzidos na 25.3, estão prontos para produção na 25.4 e não precisam mais de feature flag. Este app não usa nenhum flag para eles: veja vaadin-featureflags.properties.
