# security (de)
summary.StrictCspView=vaadin.csp=off|warn|strict: JavaScript, der als String gesendet wird, finden und entfernen.
security.strictcsp.legacy.button=Legacy: executeJs(String)
security.strictcsp.declared.button=Deklariert: executeJs(TextJs.class)
security.strictcsp.target.waiting=Warte auf JavaScript…
security.strictcsp.lead=Flow kann jetzt unter einer Nonce-basierten Content-Security-Policy ohne 'unsafe-eval' laufen. Setzen Sie vaadin.csp=warn, um jeden Aufruf zu finden, der JavaScript als String sendet, beheben Sie diese und wechseln Sie dann zu strict.
security.strictcsp.note=Beta 2: Vaadin selbst sendet an einigen Stellen noch String-JavaScript, etwa in den Event-Filtern von Doppel- und Einzelklick-Listenern und bei Tastenkürzeln. Diese lösen im strict-Modus Fehler aus, bis sie geändert werden. Testen Sie strict daher zuerst an einer Kopie Ihrer App und bleiben Sie vorerst bei warn.
security.strictcsp.mode.production=Produktionsmodus. Starten Sie mit VAADIN_CSP=off|warn|strict neu, um zu wechseln.
security.strictcsp.mode.development=Entwicklungsmodus. Starten Sie mit VAADIN_CSP=off|warn|strict neu, um zu wechseln.
security.strictcsp.table.off.all=Standard. Es wird nichts geprüft.
security.strictcsp.table.off.prod=Kein Header.
security.strictcsp.table.warn.all=String-JavaScript wird ausgeführt, und jede Aufrufstelle wird einmal mit einem Stacktrace zu Ihrem Code protokolliert.
security.strictcsp.table.warn.prod=Wie in der Entwicklung. Kein Header.
security.strictcsp.table.strict.all=String-JavaScript löst eine CspViolationException aus, auch im Entwicklungsmodus.
security.strictcsp.table.strict.prod=Sendet zusätzlich einen Nonce-basierten Content-Security-Policy-Header.
security.strictcsp.table.mode=Modus
security.strictcsp.table.everywhere=Entwicklung und Produktion
security.strictcsp.table.production=Nur Produktion
security.strictcsp.mode.heading=Der aktuelle Modus
security.strictcsp.mode.desc=Der Modus gilt gleichermaßen für Entwicklung und Produktion. Der einzige Unterschied ist der Header: Im Entwicklungsmodus wird kein Header gesendet, weil der Dev-Server und die Dev-Tools eval benötigen.
security.strictcsp.legacy.set=Per String gesetzt, im Browser kompiliert
security.strictcsp.legacy.ran=Ausgeführt. Im warn-Modus wird der erste Aufruf von dieser Zeile unten protokolliert.
security.strictcsp.legacy.blocked=Blockiert: {0} (strict-Modus)
security.strictcsp.declared.set=Per deklariertem JavaScript aus dem Bundle gesetzt
security.strictcsp.declared.ran=Ausgeführt. Deklariertes JavaScript wird nie gemeldet: Im Browser wird nichts kompiliert.
security.strictcsp.warnings.none=Noch keine Warnungen erfasst.
security.strictcsp.legacy.heading=Ein Legacy-Aufruf neben seinem deklarierten Ersatz
security.strictcsp.legacy.desc=Beide Schaltflächen setzen den Text darunter. Die erste sendet JavaScript als String, was eine strikte Policy blockiert. Die zweite ruft eine Interface-Methode auf, deren JavaScript beim Build in das Bundle aufgenommen wird. Warnungen aus dem Logger des CSP-Reporters erscheinen unten, sobald sie protokolliert werden.
summary.DeclaredJsView=@JsDefinition, typisiertes JavaScriptResult<T>, Event-Datenpfade und deklarierte Filter.
security.declaredjs.snippet.label=Zu kopierender Text
security.declaredjs.copy=Kopieren
security.declaredjs.viewport=Viewport auslesen
security.declaredjs.command.label=Befehl
security.declaredjs.lead=Deklarieren Sie JavaScript in einem Java-Interface mit @JsDefinition und @JsExpression. Es wird beim Build in das Bundle aufgenommen, sodass der Browser nie einen String kompiliert, und Aufrufe liefern typisierte Werte.
security.declaredjs.copy.ok=✅ "{0}" kopiert (JavaScriptResult<Boolean> = true)
security.declaredjs.copy.denied=⚠️ Der Browser hat den Zugriff auf die Zwischenablage verweigert (JavaScriptResult<Boolean> = false)
security.declaredjs.viewport.result=📐 {0} × {1} px, Sprache {2} (JavaScriptResult<Viewport>, ein Java-Record)
security.declaredjs.demo1.heading=Typisierte Ergebnisse: In die Zwischenablage kopieren
security.declaredjs.demo1.desc=Das Promise der Clipboard API wird auf dem Server zu einem Boolean aufgelöst. Ein JavaScript-Objekt kann ebenso gut zu einem Java-Record werden: Der Wert wird mit Jackson konvertiert.
security.declaredjs.command.placeholder=Eingeben und Enter drücken
security.declaredjs.command.hint=Nur Enter erreicht den Server. Andere Tasten werden im Browser gefiltert.
security.declaredjs.demo2.heading=Event-Datenpfade und deklarierte Filter
security.declaredjs.demo2.desc=Der Filter wird einmal deklariert und pro Listener mit einem Argument erzeugt. Der Wert des Feldes wird als Property-Pfad mit dem Event übertragen, den der Browser liest, ohne etwas zu kompilieren.
security.declaredjs.compare.before=Vor 25.4 (veraltet, benötigt 'unsafe-eval')
security.declaredjs.compare.after=25.4 (CSP-sicher)
security.declaredjs.compare.heading=Alt vs. neu
security.declaredjs.compare.desc=Die String-Varianten funktionieren weiterhin, aber setFilter(String) und addEventData(String) sind seit 25.4 veraltet, und vaadin.csp=warn meldet jede Aufrufstelle, die sie noch verwendet.
