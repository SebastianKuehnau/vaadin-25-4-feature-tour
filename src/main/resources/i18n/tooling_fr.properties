# tooling
tooling.copilot.lead=Pas de démo en direct ici : Copilot est la démo. Cette application tourne en mode développement ; ouvrez Copilot avec le bouton en bas à droite et essayez les fonctions suivantes sur les pages de cette visite.
tooling.copilot.card1.title=Tests Browserless issus de l'enregistreur de tests d'UI
tooling.copilot.card1.text=L'enregistreur écrit désormais des tests Browserless en plus des tests TestBench, et enregistre si les composants sont activés ou désactivés.
tooling.copilot.card1.step1=Ouvrez Copilot, allez dans Features et activez l'enregistreur de tests d'UI (un plugin expérimental).
tooling.copilot.card1.step2=Démarrez l'enregistrement, puis utilisez une page : essayez la page Button et cliquez sur Save (UNTIL_RESPONSE).
tooling.copilot.card1.step3=Arrêtez l'enregistrement et choisissez Browserless comme sortie.
tooling.copilot.card1.step4=Copiez le test dans src/test/java et lancez ./mvnw test.
tooling.copilot.card2.title=Vues Kotlin
tooling.copilot.card2.text=Copilot modifie les vues Kotlin comme les vues Java : les contrôles d'alignement, d'espacement, de padding et de taille, l'ajout de composants et de modèles, ainsi que l'éditeur de thème génèrent du Kotlin idiomatique, avec lambdas finales et appels sécurisés.
tooling.copilot.card2.step1=Essayez dans un projet Kotlin : cette visite est uniquement en Java.
tooling.copilot.card3.title=Form Layout auto-responsive
tooling.copilot.card3.text=Copilot choisit la bonne API pour le FormLayout auto-responsive, sans appels addFormRow inutiles.
tooling.copilot.card3.step1=Ouvrez Forms: Labels Aside.
tooling.copilot.card3.step2=Sélectionnez le Form Layout en bas et modifiez ses colonnes ou ses libellés dans Copilot.
tooling.copilot.card4.title=Component Gallery
tooling.copilot.card4.text=La vue All Components devient la Component Gallery. Elle suit le thème de votre application, est plus facile à parcourir et importe d'un coup tous vos composants personnalisés dans la bibliothèque d'UI.
tooling.copilot.card4.step1=Ouvrez Copilot et faites glisser un composant de la Component Gallery sur n'importe quelle page.
tooling.copilot.card5.title=Drilldown avec CMD/CTRL
tooling.copilot.card5.text=Maintenez CMD (macOS) ou CTRL en survolant pour descendre dans la hiérarchie et sélectionner des composants imbriqués. Copilot gère aussi les composants que votre code ajoute implicitement.
tooling.copilot.card5.step1=Sur la page Grid, maintenez CMD/CTRL et survolez la grille pour atteindre une seule colonne.
tooling.copilot.card6.title=Mises à jour optimistes (expérimental)
tooling.copilot.card6.text=Les modifications apparaissent immédiatement, avant que le serveur ne les confirme. Activez-les parmi les fonctions expérimentales de Copilot.
tooling.copilot.card6.step1=Activez les mises à jour optimistes sous Features.
tooling.copilot.card6.step2=Modifiez le texte d'un bouton sur la page Button et regardez-le se mettre à jour instantanément.
tooling.copilot.card7.title=Nouvelle prise en main et nouvelle connexion
tooling.copilot.card7.text=Un parcours de prise en main repensé et une nouvelle boîte de dialogue de connexion permettent de se connecter via le contrôleur de licence, et un indicateur dans le menu signale quand une nouvelle version dispose de notes de version. CMD + Entrée enregistre les commentaires.
tooling.hood.lead=Des changements qui n'ont pas besoin de démo, mais qui comptent lors d'une mise à niveau.
tooling.hood.card1.title=Spring Boot 4.2 et Node.js 26
tooling.hood.card1.text=Spring Boot 4.2 est la version prise en charge de cette version mineure. Node.js 26 est le minimum : si votre Node.js global est plus ancien, Vaadin télécharge Node.js 26 dans ~/.vaadin. C'est ce qui s'est passé lors du premier build du dev bundle de cette application.
tooling.hood.card2.title=vaadin-spring allégé
tooling.hood.card2.text=vaadin-spring n'embarque plus Spring MVC, Spring WebSocket ni Hibernate Validator. Le starter Spring Boot ajoute les starters websocket et validation, de sorte que les applications Boot comme celle-ci continuent de fonctionner. Les applications Spring simples les déclarent elles-mêmes.
tooling.hood.card3.title=Hilla : TypeScript généré en Java
tooling.hood.card3.text=Le TypeScript des endpoints et des modèles est généré par Java lors de la même exécution qui analyse vos classes, sans processus Node.js. TypeScriptProcessor permet aux outils de build de l'exécuter. Supprimés : la configuration du plugin de génération, nodeCommand et hilla-openapi.json. Les modèles de formulaire sont désormais des constantes @vaadin/hilla-models.
tooling.hood.card4.title=CDI et Quarkus alignés sur la version de Flow
tooling.hood.card4.text=L'add-on CDI et l'extension Quarkus sont développés dans le dépôt Flow et versionnés en 25.4.x. Les identifiants de groupe et d'artefact ne changent pas.
tooling.hood.card5.title=Observability Kit sur les événements de cycle de vie
tooling.hood.card5.text=Les métriques de navigation, de requêtes et de verrous de session sont mesurées à partir des nouveaux événements de cycle de vie de Flow, et la mesure des interactions du navigateur fonctionne en production et avec le push WebSocket. Voir la page Lifecycle Events pour les événements eux-mêmes.
tooling.hood.card6.title=Changements incompatibles
tooling.hood.card6.text=À vérifier lors de la mise à niveau :
tooling.hood.card6.step1=La propriété i18n des web components est undefined tant que vous ne la définissez pas.
tooling.hood.card6.step2=Un titre de Card placé dans un slot l'emporte désormais sur cardTitle.
tooling.hood.card6.step3=Les cellules du calendrier du Date Picker et les cellules de corps du Grid ont un nouveau DOM : vérifiez votre CSS personnalisé et vos tests.
tooling.hood.card6.step4=Les liaisons de signaux bidirectionnelles exigent désormais un callback d'écriture.
tooling.hood.card6.step5=Les données d'événement et les filtres basés sur des chaînes sont dépréciés (voir Declared JavaScript).
tooling.hood.versions=Cette application tourne avec Flow {0} sur Spring Boot {1} et Java {2}.
summary.CopilotView=Vues Kotlin, tests Browserless issus de l'enregistreur, Component Gallery et plus encore. Une visite guidée.
summary.UnderTheHoodView=TypeScript Hilla en Java, dépendances Spring allégées, Node.js 26, Spring Boot 4.2, changements incompatibles.
