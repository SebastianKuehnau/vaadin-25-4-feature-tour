components.grid.sort.desc=Wählen Sie eine Sortiereigenschaft, um über die dafür gefundene Spalte zu sortieren. Klicken Sie mit der rechten Maustaste auf eine Zelle: Das Menü wird aus DynamicContentContext für die angeklickte Spalte aufgebaut.
components.labels.lead=Die Theme-Variante LABEL_ASIDE platziert die Beschriftung eines Feldes neben dem Eingabefeld statt darüber, und zwar eigenständig, ohne Form Layout. Form Layout erhält eine Einstellung für die Textausrichtung der Beschriftungen im Modus „Beschriftungen seitlich“.
