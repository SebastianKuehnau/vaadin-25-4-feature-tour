components.grid.col.area=Domaine
components.grid.col.tier=Niveau
components.grid.selected={0} sélectionné(s)
components.grid.rowclick.heading=Sélection multiple par clic sur la ligne
components.grid.rowclick.desc=Cliquez n'importe où sur une ligne pour la basculer, pas seulement sur la case à cocher.
components.grid.sortBy.label=Trier par propriété (p. ex. depuis un paramètre d'URL ?sort=)
components.grid.lastAction.initial=Faites un clic droit sur une cellule.
components.grid.lastAction.sort=getColumnBySortProperty("{0}") → colonne « {1} »
