# tooling
tooling.copilot.lead=Qui non c'è una demo dal vivo: Copilot è la demo. Questa app gira in modalità di sviluppo, quindi apri Copilot con il pulsante in basso a destra e prova queste funzioni sulle pagine di questo tour.
tooling.copilot.card1.title=Test Browserless dal registratore di test UI
tooling.copilot.card1.text=Il registratore ora scrive test Browserless oltre ai test TestBench e registra se i componenti sono abilitati o disabilitati.
tooling.copilot.card1.step1=Apri Copilot, vai su Features e abilita il registratore di test UI (un plugin sperimentale).
tooling.copilot.card1.step2=Avvia la registrazione, poi usa una pagina: prova la pagina Button e fai clic su Save (UNTIL_RESPONSE).
tooling.copilot.card1.step3=Interrompi la registrazione e scegli Browserless come output.
tooling.copilot.card1.step4=Copia il test in src/test/java ed esegui ./mvnw test.
tooling.copilot.card2.title=Viste Kotlin
tooling.copilot.card2.text=Copilot modifica le viste Kotlin oltre a quelle Java: i controlli di allineamento, spaziatura, padding e dimensioni, l'aggiunta di componenti e template e il theme editor generano Kotlin idiomatico, comprese le trailing lambda e le safe call.
tooling.copilot.card2.step1=Provalo in un progetto Kotlin: questo tour è solo Java.
tooling.copilot.card3.title=Form Layout auto-responsive
tooling.copilot.card3.text=Copilot sceglie l'API giusta per il FormLayout auto-responsive, senza chiamate addFormRow superflue.
tooling.copilot.card3.step1=Apri Forms: Labels Aside.
tooling.copilot.card3.step2=Seleziona il Form Layout in basso e cambia le sue colonne o etichette in Copilot.
tooling.copilot.card4.title=Component Gallery
tooling.copilot.card4.text=La vista All Components ora è la Component Gallery. Segue il tema della tua applicazione, è più facile da esplorare e importa tutti i tuoi componenti personalizzati nella libreria UI in una volta sola.
tooling.copilot.card4.step1=Apri Copilot e trascina un componente dalla Component Gallery su una qualsiasi pagina.
tooling.copilot.card5.title=Drilldown con CMD/CTRL
tooling.copilot.card5.text=Tieni premuto CMD (macOS) o CTRL mentre passi il mouse per scendere nella gerarchia e selezionare componenti annidati. Copilot gestisce anche i componenti che il tuo codice aggiunge in modo implicito.
tooling.copilot.card5.step1=Nella pagina Grid, tieni premuto CMD/CTRL e passa il mouse sulla griglia per raggiungere una singola colonna.
tooling.copilot.card6.title=Aggiornamenti ottimistici (sperimentale)
tooling.copilot.card6.text=Le modifiche compaiono subito, prima che il server le confermi. Abilitali tra le funzioni sperimentali di Copilot.
tooling.copilot.card6.step1=Abilita gli aggiornamenti ottimistici in Features.
tooling.copilot.card6.step2=Cambia il testo di un pulsante nella pagina Button e guardalo aggiornarsi all'istante.
tooling.copilot.card7.title=Nuovo onboarding e nuovo accesso
tooling.copilot.card7.text=Un flusso di onboarding ridisegnato e una nuova finestra di accesso permettono di accedere tramite il license checker, e un indicatore nel menu segnala quando una nuova versione ha note di rilascio. CMD + Invio salva i commenti.
tooling.hood.lead=Modifiche che non richiedono una demo ma contano quando si aggiorna.
tooling.hood.card1.title=Spring Boot 4.2 e Node.js 26
tooling.hood.card1.text=Spring Boot 4.2 è la versione supportata di questa minor. Node.js 26 è il minimo: se il tuo Node.js globale è più vecchio, Vaadin scarica Node.js 26 in ~/.vaadin. È quello che è successo quando questa app ha costruito per la prima volta il suo dev bundle.
tooling.hood.card2.title=vaadin-spring più leggero
tooling.hood.card2.text=vaadin-spring non include più Spring MVC, Spring WebSocket né Hibernate Validator. Lo starter Spring Boot aggiunge gli starter websocket e validation, quindi le app Boot come questa continuano a funzionare. Le app Spring semplici li dichiarano da sole.
tooling.hood.card3.title=Hilla: TypeScript generato in Java
tooling.hood.card3.text=Il TypeScript di endpoint e modelli viene generato da Java nella stessa esecuzione che scansiona le tue classi, senza un processo Node.js. TypeScriptProcessor permette ai build tool di eseguirlo. Rimossi: la configurazione del plugin generatore, nodeCommand e hilla-openapi.json. I modelli dei form sono ora costanti di @vaadin/hilla-models.
tooling.hood.card4.title=CDI e Quarkus sulla versione di Flow
tooling.hood.card4.text=L'add-on CDI e l'estensione Quarkus sono sviluppati nel repository di Flow e versionati come 25.4.x. Group e artifact ID restano invariati.
tooling.hood.card5.title=Observability Kit sugli eventi del ciclo di vita
tooling.hood.card5.text=Le metriche di navigazione, richieste e lock di sessione sono misurate dai nuovi eventi del ciclo di vita di Flow, e la misurazione delle interazioni del browser funziona in produzione e con il push WebSocket. Vedi la pagina Lifecycle Events per gli eventi veri e propri.
tooling.hood.card6.title=Breaking change
tooling.hood.card6.text=Controlla questi punti quando aggiorni:
tooling.hood.card6.step1=La proprietà i18n dei web component è undefined finché non la imposti.
tooling.hood.card6.step2=Un titolo di Card inserito in uno slot ora ha la precedenza su cardTitle.
tooling.hood.card6.step3=Le celle del calendario del Date Picker e le celle del corpo del Grid hanno un nuovo DOM: controlla CSS personalizzato e test.
tooling.hood.card6.step4=I binding di signal bidirezionali ora richiedono una callback di scrittura.
tooling.hood.card6.step5=I dati di evento e i filtri basati su stringhe sono deprecati (vedi Declared JavaScript).
tooling.hood.versions=Questa app gira con Flow {0} su Spring Boot {1} e Java {2}.
summary.CopilotView=Viste Kotlin, test Browserless dal registratore, Component Gallery e altro. Un tour guidato.
summary.UnderTheHoodView=TypeScript di Hilla in Java, dipendenze Spring più leggere, Node.js 26, Spring Boot 4.2, breaking change.
