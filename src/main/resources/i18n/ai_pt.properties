ai.grid.demo2.heading=Message Input: submitDisabled
ai.grid.demo2.desc=A mesma API para os seus próprios fluxos, sem precisar de LLM. Enquanto o envio está desabilitado, o usuário pode continuar digitando a próxima mensagem, ao contrário de setEnabled(false).
