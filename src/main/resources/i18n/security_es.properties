# security (es)
summary.StrictCspView=vaadin.csp=off|warn|strict: encuentre y elimine el JavaScript enviado como cadenas.
security.strictcsp.legacy.button=Legacy: executeJs(String)
security.strictcsp.declared.button=Declarado: executeJs(TextJs.class)
security.strictcsp.target.waiting=Esperando JavaScript…
security.strictcsp.lead=Flow ahora puede ejecutarse bajo una Content-Security-Policy basada en nonce sin 'unsafe-eval'. Establezca vaadin.csp=warn para encontrar cada llamada que envía JavaScript como cadena, corríjalas y luego cambie a strict.
security.strictcsp.note=Beta 2: el propio Vaadin todavía envía JavaScript como cadena en algunos lugares, como los filtros de eventos de los listeners de doble clic y clic simple y los atajos de teclado. Estos lanzan una excepción en modo strict hasta que se modifiquen, así que pruebe strict primero en una copia de su aplicación y mantenga warn por ahora.
security.strictcsp.mode.production=Modo de producción. Reinicie con VAADIN_CSP=off|warn|strict para cambiar.
security.strictcsp.mode.development=Modo de desarrollo. Reinicie con VAADIN_CSP=off|warn|strict para cambiar.
security.strictcsp.table.off.all=Predeterminado. No se comprueba nada.
security.strictcsp.table.off.prod=Sin cabecera.
security.strictcsp.table.warn.all=El JavaScript como cadena se ejecuta, y cada punto de llamada se registra una vez con un stack trace hasta su código.
security.strictcsp.table.warn.prod=Igual que en desarrollo. Sin cabecera.
security.strictcsp.table.strict.all=El JavaScript como cadena lanza CspViolationException, también en modo de desarrollo.
security.strictcsp.table.strict.prod=Además envía una cabecera Content-Security-Policy basada en nonce.
security.strictcsp.table.mode=Modo
security.strictcsp.table.everywhere=Desarrollo y producción
security.strictcsp.table.production=Solo producción
security.strictcsp.mode.heading=El modo actual
security.strictcsp.mode.desc=El modo se aplica por igual al desarrollo y a la producción. La única diferencia es la cabecera: en modo de desarrollo no se envía ninguna cabecera, porque el servidor de desarrollo y las herramientas de desarrollo necesitan eval.
security.strictcsp.legacy.set=Establecido por una cadena, compilada en el navegador
security.strictcsp.legacy.ran=Ejecutado. En modo warn, la primera llamada desde esta línea se registra abajo.
security.strictcsp.legacy.blocked=Bloqueado: {0} (modo strict)
security.strictcsp.declared.set=Establecido por JavaScript declarado desde el bundle
security.strictcsp.declared.ran=Ejecutado. El JavaScript declarado nunca se notifica: no se compila nada en el navegador.
security.strictcsp.warnings.none=Aún no se han capturado advertencias.
security.strictcsp.legacy.heading=Una llamada legacy junto a su reemplazo declarado
security.strictcsp.legacy.desc=Ambos botones establecen el texto de abajo. El primero envía JavaScript como cadena, lo que una política estricta bloquea. El segundo llama a un método de interfaz cuyo JavaScript se incluye en el bundle durante la compilación. Las advertencias del logger del reportero de CSP aparecen abajo a medida que se registran.
summary.DeclaredJsView=@JsDefinition, JavaScriptResult<T> tipado, rutas de datos de evento y filtros declarados.
security.declaredjs.snippet.label=Texto a copiar
security.declaredjs.copy=Copiar
security.declaredjs.viewport=Leer viewport
security.declaredjs.command.label=Comando
security.declaredjs.lead=Declare JavaScript en una interfaz Java con @JsDefinition y @JsExpression. Se incluye en el bundle durante la compilación, de modo que el navegador nunca compila una cadena, y las llamadas devuelven valores tipados.
security.declaredjs.copy.ok=✅ "{0}" copiado (JavaScriptResult<Boolean> = true)
security.declaredjs.copy.denied=⚠️ El navegador denegó el acceso al portapapeles (JavaScriptResult<Boolean> = false)
security.declaredjs.viewport.result=📐 {0} × {1} px, idioma {2} (JavaScriptResult<Viewport>, un record de Java)
security.declaredjs.demo1.heading=Resultados tipados: copiar al portapapeles
security.declaredjs.demo1.desc=La promesa de la Clipboard API se resuelve a un Boolean en el servidor. Un objeto JavaScript puede convertirse igualmente en un record de Java: el valor se convierte con Jackson.
security.declaredjs.command.placeholder=Escriba y pulse Enter
security.declaredjs.command.hint=Solo Enter llega al servidor. Las demás teclas se filtran en el navegador.
security.declaredjs.demo2.heading=Rutas de datos de evento y filtros declarados
security.declaredjs.demo2.desc=El filtro se declara una vez y se crea con un argumento por listener. El valor del campo viaja con el evento como ruta de propiedad, que el navegador lee sin compilar nada.
security.declaredjs.compare.before=Antes de 25.4 (obsoleto, requiere 'unsafe-eval')
security.declaredjs.compare.after=25.4 (seguro para CSP)
security.declaredjs.compare.heading=Antiguo vs. nuevo
security.declaredjs.compare.desc=Las variantes con cadena siguen funcionando, pero setFilter(String) y addEventData(String) están obsoletos desde 25.4, y vaadin.csp=warn notifica cada punto de llamada que aún los usa.
